plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
def githubRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def appVersionCode = githubRunNumber == null ? 1 : githubRunNumber.toInteger()
def startupJingleSourceDir = rootProject.file('jingle-source')
def startupJingleResDir = layout.buildDirectory.dir('generated/startupJingleRes').get().asFile
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

tasks.register('generateStartupJingle') {
    def sourceParts = fileTree(startupJingleSourceDir) {
        include 'start_*.b64'
    }
    def outputFile = new File(startupJingleResDir, 'raw/start.mp3')
    inputs.files(sourceParts)
    outputs.file(outputFile)

    doLast {
        def parts = sourceParts.files.sort { left, right -> left.name <=> right.name }
        if (parts.isEmpty()) {
            throw new GradleException('Startup jingle source fragments are missing.')
        }
        outputFile.parentFile.mkdirs()
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        outputFile.bytes = encoded.decodeBase64()
    }
}

android {
    namespace 'de.matthiasennen.moviehub'
    compileSdk 35

    defaultConfig {
        applicationId 'de.matthiasennen.moviehub'
        minSdk 23
        targetSdk 35
        // A later signed GitHub Actions build must always be newer than the
        // installed one, otherwise Fire OS refuses the update.
        versionCode appVersionCode
        versionName "0.1.${appVersionCode}"
        multiDexEnabled true
    }

    sourceSets {
        main {
            res.srcDir startupJingleResDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (signingPropertiesFile.exists()) {
            release {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateStartupJingle')
}

dependencies {
    // Android's supported, backward-compatible Back dispatcher. It handles
    // current predictive-back gestures and Fire OS/older Android uniformly.
    implementation "androidx.activity:activity:1.10.1"
    // Media3 provides the native, D-Pad-capable player UI. SMBJ supplies the
    // SMB2/3 byte source used by the experimental FRITZ!NAS preflight.
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "com.hierynomus:smbj:0.15.0"
    testImplementation "junit:junit:4.13.2"
}
