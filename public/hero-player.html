<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Movie Hub Hero Trailer</title>
  <style>
    html, body, #player {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    (() => {
      const VIDEO_ID_PATTERN = /^[A-Za-z0-9_-]{6,20}$/
      const parentOrigin = location.origin
      let player = null
      let apiReady = false
      let playerReady = false
      let pendingVideoId = ''
      let currentVideoId = ''
      let pendingPlay = false

      function emit(type, extra = {}) {
        try {
          parent.postMessage({
            source: 'moviehub-hero-player',
            type,
            ...extra,
          }, parentOrigin)
        } catch (_) {}
      }

      function diag(message) {
        emit('diagnostic', { detail: String(message) })
        try { MovieHubHeroTrailerEvents.diagnostic(String(message)) } catch (_) {}
      }

      function fail(code) {
        emit('error', { detail: String(code) })
        try { MovieHubHeroTrailerEvents.error(String(code)) } catch (_) {}
      }

      window.onerror = (message) => {
        diag(`JS-Fehler ${message}`)
      }

      function notifyReady() {
        emit('ready')
        try { MovieHubHeroTrailerEvents.ready() } catch (_) {}
      }

      function notifyPlaying(muted) {
        emit('playing', { muted: Boolean(muted) })
        try { MovieHubHeroTrailerEvents.playing(Boolean(muted)) } catch (_) {}
      }

      function notifyEnded() {
        emit('ended')
        try { MovieHubHeroTrailerEvents.ended() } catch (_) {}
      }

      function createPlayer(videoId) {
        currentVideoId = videoId
        playerReady = false
        player = new YT.Player('player', {
          videoId,
          playerVars: {
            autoplay: 0,
            mute: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            playsinline: 1,
            rel: 0,
            origin: location.origin,
          },
          events: {
            onReady(event) {
              playerReady = true
              diag('YouTube-Player bereit')
              try {
                event.target.mute()
                event.target.setVolume(100)
              } catch (_) {}
              notifyReady()
              if (pendingPlay) {
                pendingPlay = false
                try { event.target.playVideo() } catch (_) {}
              }
            },
            onStateChange(event) {
              if (event.data === YT.PlayerState.PLAYING) {
                let muted = true
                try { muted = event.target.isMuted() } catch (_) {}
                notifyPlaying(muted)
              } else if (event.data === YT.PlayerState.ENDED) {
                notifyEnded()
              }
            },
            onError(event) {
              fail(event && event.data != null ? event.data : '?')
            },
            onAutoplayBlocked() {
              fail('autoplay-blocked')
            },
          },
        })
      }

      function applyPendingVideo() {
        if (!apiReady || !pendingVideoId) return
        const videoId = pendingVideoId
        pendingVideoId = ''

        if (!player) {
          diag(`YouTube-Player wird für ${videoId} erstellt`)
          createPlayer(videoId)
          return
        }

        currentVideoId = videoId
        try {
          player.mute()
          player.cueVideoById(videoId)
          diag(`Video-ID gesetzt · ${videoId}`)
          if (playerReady) notifyReady()
        } catch (_) {
          fail('set-video')
        }
      }

      window.movieHubLoadVideo = (videoId) => {
        const normalized = String(videoId || '')
        if (!VIDEO_ID_PATTERN.test(normalized)) {
          fail('invalid-video-id')
          return
        }
        pendingVideoId = normalized
        diag(`Video-ID empfangen · ${normalized}`)
        applyPendingVideo()
      }

      window.movieHubPlay = () => {
        pendingPlay = true
        try {
          if (!player || !currentVideoId || !playerReady) return
          pendingPlay = false
          player.playVideo()
        } catch (_) {}
      }

      window.movieHubSetMuted = (muted) => {
        try {
          if (!player) return
          if (muted) {
            player.mute()
          } else {
            player.unMute()
            player.setVolume(100)
            if (playerReady) player.playVideo()
          }
        } catch (_) {}
      }

      window.movieHubSetVolume = (value) => {
        try {
          if (player) player.setVolume(Number(value) || 0)
        } catch (_) {}
      }

      window.movieHubStop = () => {
        pendingPlay = false
        try { player?.stopVideo?.() } catch (_) {}
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== parentOrigin || event.source !== parent) return
        const message = event.data
        if (!message || message.source !== 'moviehub-hero') return

        if (message.action === 'load') {
          window.movieHubLoadVideo(message.videoId)
        } else if (message.action === 'play') {
          window.movieHubPlay()
        } else if (message.action === 'mute') {
          window.movieHubSetMuted(true)
        } else if (message.action === 'unmute') {
          window.movieHubSetMuted(false)
        } else if (message.action === 'volume') {
          window.movieHubSetVolume(message.value)
        } else if (message.action === 'stop') {
          window.movieHubStop()
        }
      })

      window.onYouTubeIframeAPIReady = () => {
        apiReady = true
        diag('YouTube-API bereit')
        applyPendingVideo()
      }

      const script = document.createElement('script')
      script.src = 'https://www.youtube.com/iframe_api'
      script.onload = () => diag('YouTube-API-Script geladen')
      script.onerror = () => {
        diag('YouTube-API-Script Ladefehler')
        fail('iframe-api-load')
      }
      document.head.appendChild(script)
      diag('Player-Seite initialisiert')
    })()
  </script>
</body>
</html>
