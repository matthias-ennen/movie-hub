<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Movie Hub Hero Trailer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <script>
    (() => {
      const parentOrigin = location.origin
      const emit = (type, extra = {}) => {
        try {
          parent.postMessage({ source: 'moviehub-hero-player', type, ...extra }, parentOrigin)
        } catch (_) {}
      }
      emit('diagnostic', { detail: 'Minimaler Frame-Test initialisiert' })
      emit('ready')
    })()
  </script>
</body>
</html>
