name: YouTube API G1 Read-only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: moviehub-youtube-api-g1-readonly
  cancel-in-progress: false

jobs:
  youtube-readonly:
    name: Probe CiNENET and Netzkino (no publication)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Authenticate via existing GitHub Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com

      - name: Setup gcloud for per-secret IAM read
        uses: google-github-actions/setup-gcloud@v3

      - name: Check isolated probe syntax
        run: node --check scripts/youtube-api-smoke.mjs

      - name: Read YouTube publisher metadata (no writes)
        run: node scripts/youtube-api-smoke.mjs

      - name: Publish public-metadata G1 report
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g1-readonly-report-${{ github.run_id }}
          path: artifacts/youtube-api-g1/report.md
          if-no-files-found: error
          retention-days: 14
