name: YouTube Movies G1 All DE Categories – 100 Video Candidates (Read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g1-all-de-categories-hundred
  cancel-in-progress: false

jobs:
  all-categories-hundred:
    name: Enumerate DE categories and screen up to 100 distinct movie video leads
    # #388: suspended until search.list uses shared project-wide CAS admission.
    if: false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Authenticate using existing Google OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Set up gcloud for existing read-only YouTube API key
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify categories and candidate mock safeguards
        run: |
          node --check scripts/youtube-movies-all-categories-hundred-g1.mjs
          node --test scripts/youtube-movies-all-categories-hundred-g1.check.mjs
      - name: Run bounded, one-off YouTube movie category study
        run: node scripts/youtube-movies-all-categories-hundred-g1.mjs
      - name: Upload research-only report for 14 days
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g1-all-categories-100-${{ github.run_id }}
          path: artifacts/youtube-movies-g1/all-categories-hundred.md
          if-no-files-found: error
          retention-days: 14
