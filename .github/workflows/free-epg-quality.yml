name: FreeEPG Quality

on:
  # Archived #4A negative-quality prototype. The automatic schedule is disabled
  # because FreeEPG was proven stale and is not part of the production data flow.
  # Keep a manual trigger only for an explicitly requested historical diagnosis.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-epg-quality
  cancel-in-progress: true

jobs:
  quality-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and inspect FreeEPG
        run: npm run epg:quality

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: free-epg-quality-${{ github.run_number }}
          path: artifacts/free-epg-quality/quality-report.json
          if-no-files-found: error
          retention-days: 30
