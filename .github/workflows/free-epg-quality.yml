name: FreeEPG Quality

on:
  schedule:
    # One central probe per day is sufficient for the isolated #4A quality stage.
    # A higher refresh frequency belongs to #4E after source quality is proven.
    - cron: '47 03 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-epg-quality
  cancel-in-progress: true

jobs:
  quality-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and inspect FreeEPG
        run: npm run epg:quality

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-epg-quality-${{ github.run_number }}
          path: artifacts/free-epg-quality/quality-report.json
          if-no-files-found: error
          retention-days: 30
