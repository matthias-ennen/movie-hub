name: Data Workflow Watchdog

on:
  schedule:
    # Check after the 03:17 Europe/Berlin data run has had two and a half hours
    # to start and finish. This independent job also detects a missing trigger.
    - cron: '47 05 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify nightly data workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_WORKFLOW_TIMEZONE: Europe/Berlin
          DATA_WORKFLOW_HOUR: '3'
          DATA_WORKFLOW_MINUTE: '17'
          DATA_WORKFLOW_MAX_DELAY_MINUTES: '60'
          DATA_WORKFLOW_NAME: Deploy Firebase
        run: npm run workflow:schedule:check
