name: Data Workflow Watchdog

on:
  schedule:
    # One daily read-only check; timezone keeps 05:00 local through DST.
    - cron: '0 5 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify nightly data workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_WORKFLOW_TIMEZONE: Europe/Berlin
          DATA_WORKFLOW_HOUR: '0'
          DATA_WORKFLOW_MINUTE: '17'
          DATA_WORKFLOW_MAX_DELAY_MINUTES: '60'
          DATA_WORKFLOW_NAME: Deploy Firebase
          DATA_WORKFLOW_EXPECTED_STATIONS: '228'
        run: npm run workflow:schedule:check
