name: Data Workflow Watchdog

on:
  schedule:
    # Primary check after the 03:17 Europe/Berlin data run has had two and a half
    # hours to start and finish. A second check reduces the chance that a dropped
    # GitHub schedule event also hides a missing data run.
    - cron: '47 05 * * *'
      timezone: 'Europe/Berlin'
    - cron: '47 06 * * *'
      timezone: 'Europe/Berlin'
  # When the scheduled data workflow does run, validate it again immediately
  # after completion. Code-push and manual Deploy Firebase runs are ignored.
  workflow_run:
    workflows: ['Deploy Firebase']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify nightly data workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_WORKFLOW_TIMEZONE: Europe/Berlin
          DATA_WORKFLOW_HOUR: '3'
          DATA_WORKFLOW_MINUTE: '17'
          DATA_WORKFLOW_MAX_DELAY_MINUTES: '60'
          DATA_WORKFLOW_NAME: Deploy Firebase
        run: npm run workflow:schedule:check
