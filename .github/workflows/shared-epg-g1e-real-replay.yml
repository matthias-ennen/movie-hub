name: Shared EPG G1e – real adapter overlap replay (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/epg-g1e-real-adapter-overlap.mjs
      - tests/epg-g1e-real-adapter-overlap.test.js
      - .github/workflows/shared-epg-g1e-real-replay.yml

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/336-g1e-real-adapter-replay' }}
    name: Audit actual healthy Waipu and Joyn SourceAdapter generations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Validate pure replay and existing shared index guards
        run: npx vitest run tests/epg-g1e-real-adapter-overlap.test.js tests/shared-epg-evidence-preview.test.js tests/shared-epg-identity-index.test.js tests/merge-tv-airings.test.js
      - name: Retrieve verified healthy-source snapshot from successful nightly #43150253272
        run: |
          mkdir -p artifacts/g1e-replay-input
          gh run download 43150253272 --repo "$GH_REPO" --name source-adapter-artifacts-43150253272-1 --dir artifacts/g1e-replay-input
          test -s artifacts/g1e-replay-input/artifacts/source-adapters/waipu-v1.json
          test -s artifacts/g1e-replay-input/artifacts/source-adapters/joyn-v1-diagnostic.json
          test -s artifacts/g1e-replay-input/public/waipu-live/index.json
          test -s artifacts/g1e-replay-input/public/joyn-live/index.json
      - name: Compare real broadcast slots, identities and original-title availability
        run: |
          node --max-old-space-size=4096 scripts/epg-g1e-real-adapter-overlap.mjs \
            --waipu artifacts/g1e-replay-input/artifacts/source-adapters/waipu-v1.json \
            --joyn artifacts/g1e-replay-input/artifacts/source-adapters/joyn-v1-diagnostic.json \
            --waipu-index artifacts/g1e-replay-input/public/waipu-live/index.json \
            --joyn-index artifacts/g1e-replay-input/public/joyn-live/index.json \
            --output artifacts/g1e-real-replay/aggregate-report.json
      - name: Upload aggregate statistics only (never raw EPG/links)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: g1e-real-adapter-overlap-${{ github.run_id }}
          path: artifacts/g1e-real-replay/aggregate-report.json
          retention-days: 7
          if-no-files-found: warn
