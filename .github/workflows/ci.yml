name: CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
    branches: [main]

jobs:
  build-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate manual production workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; begin; YAML.load_file(ARGV.fetch(0)); rescue Psych::SyntaxError => e; warn "YAML at line #{e.line}, column #{e.column}: #{e.problem}; context: #{e.context}"; exit 1; end' .github/workflows/tv-final-infrastructure.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' .github/workflows/profile-email-prepare.yml

      - name: Build
        run: npm run build

      - name: Prepare isolated TV final function and validate source syntax
        run: |
          node scripts/prepare-tv-final-function.mjs
          node --check functions/index.mjs
          node --check functions/scripts/check-tv-final-reminders.mjs
          node --check functions/src/notifications/tvFinalReminderModel.js
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import('./functions/index.mjs').then(m => { if (!m.movieHubTvFinalReminder) process.exitCode = 1 })"

      - name: Test application logic
        run: npm run test:unit

      - name: Prepare isolated email source (no send or deployment)
        run: |
          node scripts/prepare-email-function.mjs
          npm ci --prefix email-functions --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import('./email-functions/index.mjs').then(m => { if (Object.keys(m).length !== 4) process.exitCode = 1 })"
          npm audit --prefix email-functions --omit=dev --audit-level=high

      - name: Check mail infrastructure setup safety with simulated Cloud responses
        run: |
          python3 scripts/test-profile-email-cloud.py
          python3 scripts/test-profile-email-index.py

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Install browser for profile email acceptance checks
        run: npx playwright install --with-deps chromium

      - name: Check profile email UI with local Firestore and render mail templates
        run: npm run test:email:browser

      - name: Upload synthetic profile email screenshots and check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: profile-email-browser-${{ github.run_id }}
          path: artifacts/profile-email-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject high and critical production dependency findings
        run: npm audit --omit=dev --audit-level=high

      - name: Report development dependency findings
        continue-on-error: true
        run: npm audit --audit-level=high
