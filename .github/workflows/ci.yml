name: CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
    branches: [main]

jobs:
  build-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test application logic
        run: npm run test:unit

      - name: Test Firestore rules
        run: npm run test:rules

      - name: Preview current Firebase CLI dependency tree
        run: npm install --package-lock-only --save-dev firebase-tools@15.32.1

      - name: Upload refreshed dependency manifests
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Reject high and critical dependency findings
        run: npm audit --audit-level=high
