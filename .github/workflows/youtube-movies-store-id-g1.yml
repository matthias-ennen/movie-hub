name: YouTube Movies G1 ID Discovery (Read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: moviehub-youtube-movies-g1-id-discovery
  cancel-in-progress: false

jobs:
  discover-film-ids:
    name: Validate official YouTube Movies film IDs against Data API
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Authenticate via existing GitHub Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Setup gcloud for read-only secret
        uses: google-github-actions/setup-gcloud@v3
      - name: Check isolated G1 tests and source syntax
        run: |
          node --check scripts/youtube-movies-store-id-g1.mjs
          node --test scripts/youtube-movies-store-id-g1.check.mjs
      - name: Read-only YouTube Movies ID discovery probe
        run: node scripts/youtube-movies-store-id-g1.mjs
      - name: Save temporary research report
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-movies-g1-id-discovery-${{ github.run_id }}
          path: artifacts/youtube-movies-g1/id-discoverability.md
          if-no-files-found: error
          retention-days: 14
