name: Joyn Adapter Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/joyn-adapter-diagnostic.mjs'
      - 'scripts/joyn-tmdb-matcher.mjs'
      - 'scripts/joyn-station-mapping.mjs'
      - 'src/sources/joyn/**'
      - 'src/sources/adapters/joynContractMapper.js'
      - 'src/sources/policies/joynUpstreamFieldPolicy.js'
      - 'tests/joyn-tmdb-matcher.test.js'
      - '.github/workflows/joyn-adapter-diagnostic.yml'

concurrency:
  group: joyn-adapter-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore validated live TMDB catalog and search index
        run: npm run tmdb:restore
      - name: Build independent Joyn diagnostic SourceEnvelope
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          JOYN_TMDB_REQUEST_BUDGET: '120'
          JOYN_TMDB_PACE_MS: '200'
        run: npm run joyn:diagnostic
      - name: Upload Joyn diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: joyn-adapter-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/joyn-adapter/*.json
            artifacts/joyn-live/**/*.json
            artifacts/source-adapters/joyn-v1-diagnostic.json
            artifacts/source-schema/joyn-epg-upstream.*
          if-no-files-found: warn
          retention-days: 30
