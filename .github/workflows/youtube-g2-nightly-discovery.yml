name: YouTube G2 – nightly bounded public-movie discovery (private, no offers)

on:
  # Scheduled centrally by MovieHub Nightly Pipeline at 00:10 Berlin.
  # Also callable directly and manually, using Google's quota response.
  workflow_call:
  workflow_dispatch:
  # A single carefully reviewed one-off acceptance run can be started by
  # a squash merge with [youtube-nightly-once]. Ordinary code pushes skip.
  # Its successful trusted main-branch completion must trigger the separate
  # videos.list-only workflow_run recheck; this push is NOT a schedule proof.
  # Live Google quota errors, durable per-request journal, no offer claims.
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-nightly-discovery.yml
      - scripts/youtube-g2-nightly-discovery-live.mjs
      - scripts/youtube-g2-real-quota-nightly.mjs
      - scripts/youtube-g2-nightly-search-journal.mjs
      - scripts/youtube-g2-nightly-failure-report.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-private-candidate-checkpoint-mutations
  cancel-in-progress: false

jobs:
  nightly-known-to-new:
    name: Discover public TMDB film links until real Google quotaExceeded or candidates end
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[youtube-nightly-once]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
      DATA_CHECKPOINT_BUCKET: movie-hub-62459-nightly-checkpoints
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate nightly cursor, API quota guard and no-offer tests before external APIs
        run: |
          npm ci
          node --check scripts/youtube-g2-nightly-queue.mjs
          node --check scripts/youtube-g2-nightly-discovery-live.mjs
          node --check scripts/youtube-g2-nightly-search-journal.mjs
          node --check scripts/youtube-g2-real-quota-nightly.mjs
          node --check scripts/youtube-api-smoke.mjs
          node --check scripts/youtube-g2-nightly-failure-report.mjs
          npx vitest run tests/youtube-g2-nightly-queue.test.js \
            tests/youtube-g2-nightly-discovery-live.test.js \
            tests/youtube-g2-nightly-failure-report.test.js \
            tests/youtube-g2-nightly-search-journal.test.js \
            tests/youtube-api-smoke.test.js \
            tests/youtube-g2-atomic-search-budget-ledger.test.js \
            tests/youtube-g2-tmdb-first-link-pilot.test.js
      - name: Authenticate trusted OIDC principal to read private GCS and research data
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Resume film queue until confirmed YouTube search quotaExceeded
        id: nightly_discovery
        run: node scripts/youtube-g2-nightly-discovery-live.mjs
      - name: Verify safe, anonymized nightly search accounting
        if: ${{ always() && steps.nightly_discovery.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const r=JSON.parse(readFileSync('artifacts/youtube-g2/nightly-discovery/summary.json','utf8'))
          const failed=r.status==='failed'
          const count=x=>Number.isSafeInteger(x)&&x>=0
          if(r.kind!=='moviehub-youtube-g2-nightly-budgeted-discovery'
            ||r.quotaMode!=='google-enforced-no-internal-daily-cap'
            ||r.dayLimit!==null
            ||r.independentlyVerifiedDEOffers!==0
            ||r.publicationPermitted!==false
            ||r.publishedPlaybackRoutes!==0
            ||['firestoreWrites','providerWrites','catalogWrites','badgeWrites'].some(k=>r[k]!==0)
            ||Object.keys(r).some(k=>/videoId|watchUrl|secret/i.test(k)))
            throw Error('YOUTUBE_NIGHTLY_PUBLICATION_GUARD_FAILED')
          if(failed){
            if(!['youtube-rate-limit','youtube-quota-exhausted-unexpected',
                'authorization-or-api-block','checkpoint-consistency',
                'checkpoint-storage-transient','quota-preflight-or-monitoring',
                'tmdb-source','other-unclassified'].includes(r.failureCategory)
              ||r.actualSearchCallsMeasured!==false
              ||r.searchCalls!==null&&!count(r.searchCalls)
              ||r.successfulSearchCalls!==null&&!count(r.successfulSearchCalls)
              ||r.searchCalls!==null&&r.selectedForSearch!==r.searchCalls
              ||r.searchCalls!==null&&r.successfulSearchCalls>r.searchCalls)
              throw Error('YOUTUBE_NIGHTLY_FAILURE_REPORT_NOT_TRUSTED')
          }else if(!count(r.searchCalls)
            ||r.searchCalls!==r.selectedForSearch
            ||!count(r.successfulSearchCalls)
            ||r.successfulSearchCalls>r.searchCalls
            ||!count(r.rateLimitResponses)
            ||!count(r.uncertainSearchAttempts)
            ||r.rateLimitResponses+r.successfulSearchCalls
               +r.uncertainSearchAttempts>r.searchCalls)
            throw Error('YOUTUBE_NIGHTLY_SEARCH_COUNTERS_INVALID')
          if(!failed && ['rateLimitHttp429','rateLimitHttp403',
            'rateLimitUnclassified','rateLimitRetryAfterHints'].some(k=>!count(r[k])))
            throw Error('YOUTUBE_NIGHTLY_RATE_DIAGNOSTICS_INVALID')
          if(!failed && r.rateLimitHttp429+r.rateLimitHttp403>r.rateLimitResponses)
            throw Error('YOUTUBE_NIGHTLY_RATE_CODE_COUNTERS_INVALID')
          if(!failed && r.quotaExceededConfirmed===true
            &&(r.status!=='quota-exhausted-confirmed'
              ||r.searchCalls<1
              ||r.successfulSearchCalls>=r.searchCalls))
            throw Error('YOUTUBE_NIGHTLY_QUOTA_CLAIM_UNTRUSTED')
          if(!failed && r.quotaExceededConfirmed!==true
            &&r.status==='quota-exhausted-confirmed')
            throw Error('YOUTUBE_NIGHTLY_FALSE_QUOTA_EXCEEDED')
          const lines=[
            '## YouTube nightly TMDB-first discovery','',
            '- Pacific search day: '+r.pacificDate,
            '- Daily limit: enforced by Google (not a local cutoff)',
            '- Nightly started search.list attempts: '+(r.searchCalls??'unknown'),
            '- Successful search.list responses: '+(r.successfulSearchCalls??'unknown'),
            '- Rate-limit responses: '+(r.rateLimitResponses??'unknown'),
            '- HTTP 429 / 403 throttles: '+(r.rateLimitHttp429??'unknown')+' / '+(r.rateLimitHttp403??'unknown'),
            '- Ambiguous Google throttle codes: '+(r.rateLimitUnclassified??'unknown'),
            '- Google Retry-After hints: '+(r.rateLimitRetryAfterHints??'unknown'),
            '- First / last throttle observed: '+(r.rateLimitFirstAt??'unknown')+' / '+(r.rateLimitLastAt??'unknown'),
            '- Uncertain attempts after crash: '+(r.uncertainSearchAttempts??'unknown'),
            '- Google confirmed daily quota exhaustion: '+(r.quotaExceededConfirmed===true?'YES':'NO'),
            '- End reason: '+(r.terminationReason??r.failureCategory??'not specified'),
            '- New privately stored film candidates: '+(r.savedNewCandidateFilms??'unknown'),
            '- Remaining eligible TMDB films at scan: '+(r.stillEligible??'unknown'),
            '- Completed films this run: '+(r.runCompletedFilms??'not measured'),
            '- Outcome: '+r.status,
            '- Published DE offers, badges and direct playback routes: **0**',
            '- Private IDs and API credentials: not exported',
          ]
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n')
          console.log(JSON.stringify({pacificDay:r.pacificDate,
            attempts:r.searchCalls,successes:r.successfulSearchCalls,
            quotaExceededConfirmed:r.quotaExceededConfirmed===true,
            result:r.status,productionWrites:0}))
          NODE
      - name: Upload counts only (no private candidate or video IDs)
        if: ${{ always() && steps.nightly_discovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-nightly-budget-summary-${{ github.run_id }}
          path: artifacts/youtube-g2/nightly-discovery/
          if-no-files-found: warn
          retention-days: 7
