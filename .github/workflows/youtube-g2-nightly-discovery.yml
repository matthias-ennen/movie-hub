name: YouTube G2 – nightly bounded public-movie discovery (private, no offers)

on:
  # Scheduled centrally by MovieHub Nightly Pipeline at 00:10 Berlin.
  # Also callable directly and manually, with unchanged private quota guards.
  workflow_call:
  workflow_dispatch:
  # A single carefully reviewed one-off acceptance run can be started by
  # a squash merge with [youtube-nightly-once]. Ordinary code pushes skip.
  # Its successful trusted main-branch completion must trigger the separate
  # videos.list-only workflow_run recheck; this push is NOT a schedule proof.
  # Live Google quota errors, durable per-PT-day CAS and no-retry offer guards.
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-nightly-discovery.yml
      - scripts/youtube-g2-nightly-discovery-live.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-private-candidate-checkpoint-mutations
  cancel-in-progress: false

jobs:
  nightly-known-to-new:
    name: Discover public TMDB film links until real Google quotaExceeded or candidates end
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[youtube-nightly-once]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
      DATA_CHECKPOINT_BUCKET: movie-hub-62459-nightly-checkpoints
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate nightly cursor, API quota guard and no-offer tests before external APIs
        run: |
          npm ci
          node --check scripts/youtube-g2-nightly-queue.mjs
          node --check scripts/youtube-g2-nightly-discovery-live.mjs
          node --check scripts/youtube-g2-nightly-failure-report.mjs
          npx vitest run tests/youtube-g2-nightly-queue.test.js \
            tests/youtube-g2-nightly-discovery-live.test.js \
            tests/youtube-g2-nightly-failure-report.test.js \
            tests/youtube-g2-atomic-search-budget-ledger.test.js \
            tests/youtube-g2-tmdb-first-link-pilot.test.js
      - name: Authenticate trusted OIDC principal to read private GCS and research data
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Resume film queue until confirmed YouTube search quotaExceeded
        id: nightly_discovery
        run: node scripts/youtube-g2-nightly-discovery-live.mjs
      - name: Verify safe, anonymized nightly budget summary
        if: ${{ always() && steps.nightly_discovery.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const r=JSON.parse(readFileSync('artifacts/youtube-g2/nightly-discovery/summary.json','utf8'))
          const failed=r.status==='failed'
          if(r.kind!=='moviehub-youtube-g2-nightly-budgeted-discovery'
            ||r.dayLimit!==200
            ||r.independentlyVerifiedDEOffers!==0
            ||r.publicationPermitted!==false
            ||r.publishedPlaybackRoutes!==0
            ||['firestoreWrites','providerWrites','catalogWrites','badgeWrites'].some(k=>r[k]!==0)
            ||Object.keys(r).some(k=>/videoId|watchUrl|secret/i.test(k)))
            throw Error('YOUTUBE_NIGHTLY_BUDGET_OR_PUBLICATION_GUARD_FAILED')
          if(failed){
            // A GCS reservation is NOT proof of an actual search.list call.
            if(r.searchCalls!==null||r.actualSearchCallsMeasured!==false
              ||!['youtube-rate-limit','authorization-or-api-block',
                  'checkpoint-consistency','quota-preflight-or-monitoring',
                  'tmdb-source','other-unclassified'].includes(r.failureCategory)
              ||(r.selectedForSearch!==null
                 &&(!Number.isInteger(r.selectedForSearch)
                     ||r.selectedForSearch<0||r.selectedForSearch>200))
              ||(r.sharedDayReserved!==null
                 &&(!Number.isInteger(r.sharedDayReserved)
                     ||r.sharedDayReserved<0||r.sharedDayReserved>200))
              ||(r.priorReserved!==null
                 &&r.priorReserved+r.selectedForSearch!==r.sharedDayReserved))
              throw Error('YOUTUBE_NIGHTLY_FAILURE_REPORT_NOT_TRUSTED')
          }else if(!Number.isInteger(r.searchCalls)||r.searchCalls<0
            ||r.searchCalls>r.selectedForSearch
            ||r.selectedForSearch>200||r.priorReserved>200
            ||r.selectedForSearch+r.priorReserved>200)
            throw Error('YOUTUBE_NIGHTLY_BUDGET_OR_PUBLICATION_GUARD_FAILED')
          if(r.quotaExceededConfirmed===true
            &&(r.status!=='quota-exhausted-confirmed'
              ||r.searchCalls<1
              ||r.successfulSearchCalls!==r.searchCalls-1))
            throw Error('YOUTUBE_NIGHTLY_QUOTA_CLAIM_UNTRUSTED')
          if(r.quotaExceededConfirmed!==true
            &&r.status==='quota-exhausted-confirmed')
            throw Error('YOUTUBE_NIGHTLY_FALSE_QUOTA_EXCEEDED')
          const lines=[
            '## YouTube nightly private, budgeted TMDB-first discovery','',
            '- Pacific research day: '+r.pacificDate,
            '- Shared conservative daily search cap: '+r.dayLimit,
            '- Prior manual/research reservations: '+r.priorReserved,
            '- Nightly reserved search attempts: '+(r.selectedForSearch??'unknown'),
            '- Actual search.list attempts (including quota-rejected): '+(r.searchCalls??'unknown after failure'),
            '- Successful search.list calls: '+(r.successfulSearchCalls??'unknown'),
            '- Confirmed YouTube quotaExceeded: '+(r.quotaExceededConfirmed===true?'YES':'NO'),
            '- Stop reason: '+(r.terminationReason??'no quota boundary observed'),
            '- New privately stored film candidates: '+(r.savedNewCandidateFilms??'unknown after failure'),
            '- Total still-eligible public badge films at scan: '+(r.stillEligible??'unknown'),
            '- Completed cursor entries this run: '+(r.runCompletedFilms??'not measured'),
            '- Failure category: '+(r.failureCategory??'none'),
            '- Outcome: '+r.status,
            '- Published DE offers, badges and direct playback routes: **0**',
            '- Personal profile/private film IDs: not exported',
          ]
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n')
          console.log(JSON.stringify({pacificDay:r.pacificDate,
            reserved:r.selectedForSearch,searches:r.searchCalls,
            actualSearchCallsKnown:!failed,
            result:r.status,productionWrites:0}))
          NODE
      - name: Upload counts only (no private candidate or video IDs)
        if: ${{ always() && steps.nightly_discovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-nightly-budget-summary-${{ github.run_id }}
          path: artifacts/youtube-g2/nightly-discovery/
          if-no-files-found: warn
          retention-days: 7
