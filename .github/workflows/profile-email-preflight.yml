name: Profile email infrastructure preflight

# Metadata inspection only. No secret payload, IAM write, deployment or email.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-email-preflight.yml
      - scripts/profile-email-preflight.mjs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: moviehub-profile-email-preflight
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect prerequisites without reading secret values
        run: node scripts/profile-email-preflight.mjs
