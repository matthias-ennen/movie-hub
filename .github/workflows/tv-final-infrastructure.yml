name: TV final reminder infrastructure (manual)

# Neither PRs nor nightly Firebase deployments may activate the scheduler.
# The production operation is intentionally available ONLY after merging
# verified code and a separate exact confirmation in GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight, private function prepare, or explicitly approved minute activation
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - prepare
          - activate
      confirmation:
        description: PREPARE_MOVIEHUB_TV_FINAL_PRIVATE or ENABLE_MOVIEHUB_TV_FINAL_1MIN
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: moviehub-tv-final-infrastructure
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate Cloud prerequisites without creating or modifying anything
        env:
          PROJECT: movie-hub-62459
          REGION: europe-west3
          RUNTIME_SA: movie-hub-tv-final@movie-hub-62459.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          failed=0
          echo "### MovieHub TV final reminder – read-only infrastructure preflight" >> "$GITHUB_STEP_SUMMARY"

          # In contrast to the old informational probe, absent prerequisites
          # MUST make this job red. No service enablement, IAM writes or deploy.
          if enabled="$(gcloud services list --enabled --project="$PROJECT" --format='value(config.name)')"; then
            required=(
              cloudfunctions.googleapis.com
              cloudscheduler.googleapis.com
              run.googleapis.com
              cloudbuild.googleapis.com
              artifactregistry.googleapis.com
              eventarc.googleapis.com
              firestore.googleapis.com
            )
            for api in "${required[@]}"; do
              if grep -Fxq "$api" <<< "$enabled"; then
                echo "✅ API: $api" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "❌ Missing enabled API: $api" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              fi
            done
          else
            echo "❌ Cannot inspect enabled APIs – check the deploy account's Service Usage read permissions." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud iam service-accounts describe "$RUNTIME_SA" --project="$PROJECT" --format='value(email)' >/dev/null; then
            echo "✅ Isolated runtime service account exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Isolated runtime service account is missing or cannot be read: $RUNTIME_SA" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud iam roles describe MovieHubTvFinalRuntime --project="$PROJECT" --format='value(name)' >/dev/null; then
            echo "✅ Dedicated Firestore runtime role exists (assignment still requires review)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Dedicated Firestore runtime role is missing or cannot be read." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if billing="$(gcloud billing projects describe "$PROJECT" --format='value(billingEnabled)')"; then
            if [ "$billing" = "True" ] || [ "$billing" = "true" ]; then
              echo "✅ Google Cloud billing is enabled." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Google Cloud billing is not enabled." >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          else
            echo "❌ Cannot verify Cloud Billing status: Billing Account Viewer or billing.projects.get is required." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud scheduler jobs list --project="$PROJECT" --location="$REGION"               --format='table(name,schedule,state)' > "$RUNNER_TEMP/moviehub-tv-final-existing-jobs.txt"; then
            echo "✅ Existing Cloud Scheduler jobs can be inspected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Cloud Scheduler jobs cannot be inspected." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "❌ Infrastructure preflight failed; no activation was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Infrastructure preflight passed (read-only). **This does not activate the function.**" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'prepare' && inputs.confirmation == 'PREPARE_MOVIEHUB_TV_FINAL_PRIVATE' }}
    runs-on: ubuntu-latest
    environment: production-tv-final-reminders
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require dedicated accounts before touching production
        run: |
          set -euo pipefail
          for account in movie-hub-tv-final movie-hub-tv-build; do
            gcloud iam service-accounts describe "$account@movie-hub-62459.iam.gserviceaccount.com" --project=movie-hub-62459 --format='value(email)' >/dev/null
          done
          # Do not impersonate the privileged default Compute/Editor service account.
      - name: Refuse prepare if a TV minute scheduler already exists
        run: |
          set -euo pipefail
          gcloud scheduler jobs list --project=movie-hub-62459 --location=europe-west3 --format='value(name)' > "$RUNNER_TEMP/tv-scheduler-jobs.txt"
          if grep -Eiq '(^|/)(movie-hub-tv-final-1min|firebase-schedule-moviehubtvfinalreminder-europe-west3)$' "$RUNNER_TEMP/tv-scheduler-jobs.txt"; then
            echo 'TV minute scheduler already exists: refusing to redeploy an active worker through prepare.' >&2
            exit 1
          fi
      - name: Test audited worker and private HTTP handler
        run: |
          npm ci
          node scripts/prepare-tv-final-function.mjs
          npm install --prefix functions --omit=dev --no-audit --no-fund
          node --check functions/index.mjs
          node --check functions/tv-final-http.mjs
          npm run test:unit
      - name: Deploy only the planned Firestore composite index
        run: npx firebase-tools deploy --only firestore:indexes --project movie-hub-62459 --non-interactive
      - name: Wait until the required TV notification index is ready
        run: |
          set -euo pipefail
          ready=0
          for attempt in {1..40}; do
            gcloud firestore indexes composite list --database='(default)' --project=movie-hub-62459 --format=json > "$RUNNER_TEMP/tv-indices.json"
            state="$(node --input-type=module -e '
              import fs from "node:fs"
              const list = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
              const match = list.find(x => x.queryScope === "COLLECTION_GROUP"
                && x.name?.includes("/collectionGroups/notifications/")
                && ["phase","scheduleStatus","airingStartAt"].every(f => x.fields?.some(v => v.fieldPath === f)))
              process.stdout.write(match?.state || "NOT_FOUND")
            ' "$RUNNER_TEMP/tv-indices.json")"
            echo "Index state: $state"
            if [ "$state" = READY ]; then ready=1; break; fi
            if [ "$state" = NOT_FOUND ] || [ "$state" = ERROR ]; then exit 1; fi
            sleep 20
          done
          test "$ready" = 1
      - name: Deploy private HTTP function with isolated build identity (no scheduler)
        run: |
          gcloud functions deploy movieHubTvFinalReminder --gen2 \
            --project=movie-hub-62459 --region=europe-west3 \
            --runtime=nodejs22 --source=functions --entry-point=movieHubTvFinalReminder \
            --trigger-http --no-allow-unauthenticated \
            --service-account=movie-hub-tv-final@movie-hub-62459.iam.gserviceaccount.com \
            --build-service-account=projects/movie-hub-62459/serviceAccounts/movie-hub-tv-build@movie-hub-62459.iam.gserviceaccount.com \
            --memory=256MiB --timeout=60s --max-instances=1 --min-instances=0 --concurrency=1 --quiet
      - name: Verify deployed build/runtime identities (still no schedule)
        run: |
          gcloud functions describe movieHubTvFinalReminder --gen2 --region=europe-west3 --project=movie-hub-62459 --format=json > "$RUNNER_TEMP/tv-function.json"
          node scripts/tv-final-deploy-guard.mjs "$RUNNER_TEMP/tv-function.json" > "$RUNNER_TEMP/verified-tv-function.txt"
          echo "### Private TV function prepared; Cloud Scheduler has NOT been activated" >> "$GITHUB_STEP_SUMMARY"

  activate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'activate' && inputs.confirmation == 'ENABLE_MOVIEHUB_TV_FINAL_1MIN' }}
    runs-on: ubuntu-latest
    environment: production-tv-final-reminders
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify previously prepared private function and scheduler identity
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe movie-hub-tv-scheduler@movie-hub-62459.iam.gserviceaccount.com --project=movie-hub-62459 --format='value(email)' >/dev/null
          gcloud functions describe movieHubTvFinalReminder --gen2 --region=europe-west3 --project=movie-hub-62459 --format=json > "$RUNNER_TEMP/tv-function.json"
          node scripts/tv-final-deploy-guard.mjs "$RUNNER_TEMP/tv-function.json" > "$RUNNER_TEMP/verified-tv-function.txt"
          # A failed list is a hard failure, never confused with an absent job.
          gcloud scheduler jobs list --location=europe-west3 --project=movie-hub-62459 --format='value(name)' > "$RUNNER_TEMP/existing-tv-jobs.txt"
          if grep -Eiq '(^|/)(movie-hub-tv-final-1min|firebase-schedule-moviehubtvfinalreminder-europe-west3)$' "$RUNNER_TEMP/existing-tv-jobs.txt"; then
            echo 'A TV scheduler job already exists: abort rather than duplicate or replace it.' >&2
            exit 1
          fi
      - name: Refuse activation if the existing Cloud Run service is publicly callable
        run: |
          set -euo pipefail
          mapfile -t verified < "$RUNNER_TEMP/verified-tv-function.txt"
          gcloud run services get-iam-policy "${verified[1]}" --project=movie-hub-62459 --region=europe-west3 --format=json > "$RUNNER_TEMP/preactivate-tv-iam.json"
          gcloud run services describe "${verified[1]}" --project=movie-hub-62459 --region=europe-west3 --format=json > "$RUNNER_TEMP/preactivate-tv-service.json"
          node --input-type=module -e '
            import fs from "node:fs"
            const policy=JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
            const service=JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
            if ((policy.bindings||[]).some(b=>(b.members||[]).some(m=>m==="allUsers"||m==="allAuthenticatedUsers")))
              throw new Error("Cannot activate a publicly callable TV function")
            // Cloud Run can be public even without allUsers, when its Invoker IAM check is disabled.
            if (service.invokerIamDisabled === true
              || service.invoker_iam_disabled === true
              || service.metadata?.annotations?.["run.googleapis.com/invoker-iam-disabled"] === "true")
              throw new Error("Cloud Run Invoker IAM check is disabled")
          ' "$RUNNER_TEMP/preactivate-tv-iam.json" "$RUNNER_TEMP/preactivate-tv-service.json"
      - name: Grant one scheduler identity invocation on only this private service
        run: |
          set -euo pipefail
          mapfile -t verified < "$RUNNER_TEMP/verified-tv-function.txt"
          gcloud run services add-iam-policy-binding "${verified[1]}" \
            --project=movie-hub-62459 --region=europe-west3 \
            --member=serviceAccount:movie-hub-tv-scheduler@movie-hub-62459.iam.gserviceaccount.com \
            --role=roles/run.invoker --quiet
          gcloud run services get-iam-policy "${verified[1]}" --project=movie-hub-62459 --region=europe-west3 --format=json > "$RUNNER_TEMP/runner-policy.json"
          node --input-type=module -e '
            import fs from "node:fs"
            const policy=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))
            const bindings=policy.bindings||[]
            const invoker=bindings.find(b=>b.role==="roles/run.invoker")
            if(!invoker?.members?.includes("serviceAccount:movie-hub-tv-scheduler@movie-hub-62459.iam.gserviceaccount.com"))
              throw new Error("Expected scheduler invoker permission missing")
            if(bindings.some(b=>b.members?.some(m=>m==="allUsers"||m==="allAuthenticatedUsers")))
              throw new Error("Function has a public IAM binding")
          ' "$RUNNER_TEMP/runner-policy.json"
      - name: Create exactly one private one-minute job (live activation)
        run: |
          set -euo pipefail
          mapfile -t verified < "$RUNNER_TEMP/verified-tv-function.txt"
          gcloud scheduler jobs create http movie-hub-tv-final-1min \
            --project=movie-hub-62459 --location=europe-west3 \
            --schedule='* * * * *' --time-zone='Etc/UTC' \
            --uri="${verified[0]}" --http-method=POST --attempt-deadline=60s --max-retry-attempts=0 \
            --oidc-service-account-email=movie-hub-tv-scheduler@movie-hub-62459.iam.gserviceaccount.com \
            --oidc-token-audience="${verified[0]}" \
            --description='MovieHub profile-private five-minute TV reminders' --quiet
          gcloud scheduler jobs describe movie-hub-tv-final-1min --project=movie-hub-62459 --location=europe-west3 --format='table(state,schedule,timeZone)'
          echo '### MovieHub private TV minute scheduler activated – verify logs and devices' >> "$GITHUB_STEP_SUMMARY"
