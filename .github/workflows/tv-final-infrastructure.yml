name: TV final reminder infrastructure (manual)

# Neither PRs nor nightly Firebase deployments may activate the scheduler.
# The production operation is intentionally available ONLY after merging
# verified code and a separate exact confirmation in GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight or live scheduler activation
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - activate
      confirmation:
        description: For activation type ENABLE_MOVIEHUB_TV_FINAL_1MIN
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: moviehub-tv-final-infrastructure
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate Cloud prerequisites without creating or modifying anything
        env:
          PROJECT: movie-hub-62459
          REGION: europe-west3
          RUNTIME_SA: movie-hub-tv-final@movie-hub-62459.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          failed=0
          echo "### MovieHub TV final reminder – read-only infrastructure preflight" >> "$GITHUB_STEP_SUMMARY"

          # In contrast to the old informational probe, absent prerequisites
          # MUST make this job red. No service enablement, IAM writes or deploy.
          if enabled="$(gcloud services list --enabled --project="$PROJECT" --format='value(config.name)')"; then
            required=(
              cloudfunctions.googleapis.com
              cloudscheduler.googleapis.com
              run.googleapis.com
              cloudbuild.googleapis.com
              artifactregistry.googleapis.com
              eventarc.googleapis.com
              firestore.googleapis.com
            )
            for api in "${required[@]}"; do
              if grep -Fxq "$api" <<< "$enabled"; then
                echo "✅ API: $api" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "❌ Missing enabled API: $api" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              fi
            done
          else
            echo "❌ Cannot inspect enabled APIs – check the deploy account's Service Usage read permissions." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud iam service-accounts describe "$RUNTIME_SA" --project="$PROJECT" --format='value(email)' >/dev/null; then
            echo "✅ Isolated runtime service account exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Isolated runtime service account is missing or cannot be read: $RUNTIME_SA" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud iam roles describe MovieHubTvFinalRuntime --project="$PROJECT" --format='value(name)' >/dev/null; then
            echo "✅ Dedicated Firestore runtime role exists (assignment still requires review)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Dedicated Firestore runtime role is missing or cannot be read." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if billing="$(gcloud billing projects describe "$PROJECT" --format='value(billingEnabled)')"; then
            if [ "$billing" = "True" ] || [ "$billing" = "true" ]; then
              echo "✅ Google Cloud billing is enabled." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Google Cloud billing is not enabled." >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          else
            echo "❌ Cannot verify Cloud Billing status: Billing Account Viewer or billing.projects.get is required." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if gcloud scheduler jobs list --project="$PROJECT" --location="$REGION"               --format='table(name,schedule,state)' > "$RUNNER_TEMP/moviehub-tv-final-existing-jobs.txt"; then
            echo "✅ Existing Cloud Scheduler jobs can be inspected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Cloud Scheduler jobs cannot be inspected." >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "❌ Infrastructure preflight failed; no activation was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Infrastructure preflight passed (read-only). **This does not activate the function.**" >> "$GITHUB_STEP_SUMMARY"

  activate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'activate' && inputs.confirmation == 'ENABLE_MOVIEHUB_TV_FINAL_1MIN' }}
    runs-on: ubuntu-latest
    environment: production-tv-final-reminders
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify runtime identity exists
        run: |
          gcloud iam service-accounts describe movie-hub-tv-final@movie-hub-62459.iam.gserviceaccount.com --project=movie-hub-62459 --format='value(email)'
      - name: Install and build the audited function package
        run: |
          npm ci
          node scripts/prepare-tv-final-function.mjs
          npm install --prefix functions --omit=dev --no-audit --no-fund
          node --check functions/index.mjs
          node --check functions/scripts/check-tv-final-reminders.mjs
          npm run test:unit
      - name: Authenticate and deploy the required Firestore index only
        run: npx firebase-tools deploy --only firestore:indexes --project movie-hub-62459 --non-interactive
      - name: Wait for the TV reminder index to be READY
        run: |
          set -euo pipefail
          found=0
          for attempt in {1..40}; do
            json="$(gcloud firestore indexes composite list --database='(default)' --project=movie-hub-62459 --format=json)"
            state="$(node -e '
              const all=JSON.parse(process.argv[1]);
              const index=all.find(x=>x.queryScope==="COLLECTION_GROUP"
                && x.name?.includes("/collectionGroups/notifications/")
                && x.fields?.some(f=>f.fieldPath==="phase")
                && x.fields?.some(f=>f.fieldPath==="scheduleStatus")
                && x.fields?.some(f=>f.fieldPath==="airingStartAt"));
              process.stdout.write(index?.state||"NOT_FOUND");
            ' "$json")"
            echo "Index state: $state"
            if [ "$state" = "READY" ]; then found=1; break; fi
            if [ "$state" = "NOT_FOUND" ] || [ "$state" = "ERROR" ]; then exit 1; fi
            sleep 20
          done
          test "$found" = 1
      - name: Activate one isolated scheduled function
        run: npx firebase-tools deploy --only functions:tv-final-reminders --project movie-hub-62459 --non-interactive
      - name: Record deployment
        run: |
          echo "### MovieHub minute reminder activated" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase Functions codebase: tv-final-reminders; function: movieHubTvFinalReminder; region: europe-west3." >> "$GITHUB_STEP_SUMMARY"
