name: YouTube G2 – Pacific daily search budget preflight (read-only, NO search)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-pacific-search-preflight.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-pacific-search-preflight-readonly
  cancel-in-progress: false

jobs:
  quota-diagnostic:
    name: Bound current Pacific-day search quota telemetry; never authorize a search
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[youtube-pacific-budget-preflight-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify fail-closed Pacific DST and project quota tests
        run: |
          npm ci
          node --check scripts/youtube-g2-pacific-search-preflight.mjs
          npx vitest run tests/youtube-g2-pacific-search-preflight.test.js \
            tests/youtube-g2-legacy-quota-scope-diagnostic.test.js
      - name: Derive current Pacific quota window from actual current UTC instant
        id: window
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs'
          import {pacificSearchDay} from './scripts/youtube-g2-pacific-search-preflight.mjs'
          const now=new Date().toISOString()
          const day=pacificSearchDay(now)
          appendFileSync(process.env.GITHUB_OUTPUT,
            'now='+now+'\nstart='+day.start+'\n')
          console.log('Pacific day: '+day.date+'; next reset: '+day.end)
          NODE
      - name: Authenticate existing Google OIDC principal (no new keys or permissions)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read bounded PT-day Monitoring metrics plus one scope diagnostic (GET only)
        id: monitoring
        shell: bash
        env:
          START: ${{ steps.window.outputs.start }}
          NOW: ${{ steps.window.outputs.now }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/moviehub-youtube-pt-budget-private
          token="$(gcloud auth print-access-token)"
          for type in rate exceeded ratev2 ratev2scope ratescope exceededscope; do
            if [[ "$type" == rate || "$type" == ratescope ]]; then kind='rate/net_usage';
            elif [[ "$type" == ratev2 || "$type" == ratev2scope ]]; then kind='ratev2/net_usage';
            else kind='exceeded'; fi
            FILTER="metric.type=\"serviceruntime.googleapis.com/quota/$kind\" AND resource.type=\"consumer_quota\" AND resource.label.service=\"youtube.googleapis.com\""
            # Scope check drops only quota_metric: no raw Google labels leave /tmp.
            if [[ "$type" != ratev2scope && "$type" != ratescope && "$type" != exceededscope ]]; then
              FILTER+=" AND metric.label.quota_metric=\"youtube.googleapis.com/search_list\""
            fi
            code="$(curl --silent --show-error --max-time 35 --retry 0 \
              --get --header "Authorization: Bearer $token" \
              --header 'Accept: application/json' \
              --data-urlencode "filter=$FILTER" \
              --data-urlencode "interval.startTime=$START" \
              --data-urlencode "interval.endTime=$NOW" \
              --data-urlencode 'view=FULL' \
              --data-urlencode 'pageSize=5000' \
              --output "/tmp/moviehub-youtube-pt-budget-private/$type.json" \
              --write-out '%{http_code}' \
              'https://monitoring.googleapis.com/v3/projects/movie-hub-62459/timeSeries')"
            [[ "$code" =~ ^[0-9]{3}$ ]] || {
              echo '::error::Invalid Google Monitoring HTTP response'
              exit 1
            }
            echo "$type=$code" >> "$GITHUB_OUTPUT"
          done
          unset token FILTER
          echo 'Cloud Monitoring PT-day GET-only telemetry completed (raw responses private).'
      - name: Compare narrow and service-wide legacy quota timeSeries (READ-ONLY)
        shell: bash
        env:
          RATE_HTTP: ${{ steps.monitoring.outputs.rate }}
          EXCEEDED_HTTP: ${{ steps.monitoring.outputs.exceeded }}
          RATE_SCOPE_HTTP: ${{ steps.monitoring.outputs.ratescope }}
          EXCEEDED_SCOPE_HTTP: ${{ steps.monitoring.outputs.exceededscope }}
        run: |
          set -euo pipefail
          # Only Google Monitoring GETs are performed above;
          # 0 search requests, 0 quota changes, no GCS mutations.
          mkdir -p artifacts/youtube-g2/pacific-search-preflight
          node scripts/youtube-g2-legacy-quota-scope-diagnostic.mjs \
            "$RATE_HTTP" /tmp/moviehub-youtube-pt-budget-private/rate.json \
            "$EXCEEDED_HTTP" /tmp/moviehub-youtube-pt-budget-private/exceeded.json \
            "$RATE_SCOPE_HTTP" /tmp/moviehub-youtube-pt-budget-private/ratescope.json \
            "$EXCEEDED_SCOPE_HTTP" /tmp/moviehub-youtube-pt-budget-private/exceededscope.json \
            artifacts/youtube-g2/pacific-search-preflight/legacy-scope.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const r=JSON.parse(readFileSync(
            'artifacts/youtube-g2/pacific-search-preflight/legacy-scope.json',
            'utf8'))
          if(r.kind!=='moviehub-youtube-g2-legacy-quota-scope-readonly'
            ||r.authorizedSearchCalls!==0||r.youtubeApiCalls!==0
            ||r.gcsWrites!==0||r.quotaWrites!==0
            ||r.publicationPermitted!==false
            ||r.currentRemainingQuota!==null
            ||r.measuredActualSearchCalls!==null
            ||Object.keys(r).some(k=>/videoId|watchUrl|secret|token/i.test(k)))
            throw Error('UNSAFE_LEGACY_QUOTA_DIAGNOSTIC')
          const keys=['rate','rateScope','exceeded','exceededScope']
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\nLegacy quota telemetry comparison (never search authorization):\n'+
            keys.map(k=>'- '+k+': HTTP '+r[k].http+
              ', shape '+r[k].shape+
              ', series '+r[k].series+
              ', matching search quota series '+r[k].targetSeries+
              ', points '+r[k].points).join('\n')+
            '\nMissing exceeded series are UNKNOWN, never proof of zero quota failures.\n')
          NODE
      - name: Inspect windowed quota-v2 telemetry only (NEVER an authorization)
        shell: bash
        env:
          V2_HTTP: ${{ steps.monitoring.outputs.ratev2 }}
          SCOPE_HTTP: ${{ steps.monitoring.outputs.ratev2scope }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/youtube-g2/pacific-search-preflight
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs'
          const http=Number(process.env.V2_HTTP)
          let series=[],valid=http===200,points=0,latest=null
          let sampledMax=null,narrowResponseShape='http-not-200'
          if(valid){
            try{
              const doc=JSON.parse(readFileSync(
                '/tmp/moviehub-youtube-pt-budget-private/ratev2.json','utf8'))
              narrowResponseShape=Array.isArray(doc?.timeSeries)
                ?(doc.timeSeries.length?'timeSeries-present':'timeSeries-empty')
                :(doc&&typeof doc==='object'&&!Array.isArray(doc)
                  &&!Object.hasOwn(doc,'timeSeries')
                  ?'timeSeries-omitted':'unexpected-body')
              if(!Array.isArray(doc?.timeSeries)||doc.nextPageToken
                ||doc.timeSeries.length>100)throw Error('invalid-page')
              series=doc.timeSeries
              for(const s of series){
                if(s?.metric?.type!=='serviceruntime.googleapis.com/quota/ratev2/net_usage'
                  ||s?.metric?.labels?.quota_metric!=='youtube.googleapis.com/search_list'
                  ||s?.resource?.type!=='consumer_quota'
                  ||s?.resource?.labels?.service!=='youtube.googleapis.com'
                  ||!Array.isArray(s.points)||s.points.length>5000)
                  throw Error('unexpected-series')
                for(const p of s.points){
                  const raw=p?.value?.int64Value
                  if(typeof raw!=='string'||!/^\d{1,14}$/.test(raw))
                    throw Error('invalid-count')
                  const count=Number(raw),t=Date.parse(p?.interval?.endTime)
                  if(!Number.isFinite(t))throw Error('invalid-end-time')
                  sampledMax=sampledMax===null?count:Math.max(sampledMax,count)
                  const iso=new Date(t).toISOString()
                  if(!latest||iso>latest)latest=iso
                  points++
                }
              }
            }catch{valid=false;series=[];points=0;latest=null;sampledMax=null}
          }
          // The second ratev2 GET tests whether filtering by quota_metric
          // excluded telemetry. Never publish quota labels or raw response.
          const scopeHttp=Number(process.env.SCOPE_HTTP)
          let scopeShape='http-not-200',scopeSeries=0,scopeTargetSeries=0
          let scopeHasMore=false
          if(scopeHttp===200){
            try{
              const doc=JSON.parse(readFileSync(
                '/tmp/moviehub-youtube-pt-budget-private/ratev2scope.json','utf8'))
              if(!doc||typeof doc!=='object'||Array.isArray(doc))
                throw Error('invalid-object')
              if(doc.timeSeries===undefined){
                scopeShape='timeSeries-omitted'
              }else{
                if(!Array.isArray(doc.timeSeries)||doc.timeSeries.length>5000)
                  throw Error('invalid-series')
                scopeShape=doc.timeSeries.length?'timeSeries-present':'timeSeries-empty'
                scopeSeries=doc.timeSeries.length
                scopeTargetSeries=doc.timeSeries.filter(s=>
                  s?.metric?.type==='serviceruntime.googleapis.com/quota/ratev2/net_usage'
                  &&s?.resource?.type==='consumer_quota'
                  &&s?.resource?.labels?.service==='youtube.googleapis.com'
                  &&s?.metric?.labels?.quota_metric==='youtube.googleapis.com/search_list'
                ).length
              }
              scopeHasMore=Boolean(doc.nextPageToken)
            }catch{
              scopeShape='invalid-json-or-shape'
              scopeSeries=0;scopeTargetSeries=0;scopeHasMore=false
            }
          }
          // A gauge's maximum is NOT cumulative PT-day quota and cannot
          // grant a global Google project lease. This is diagnosis only.
          const out={kind:'youtube-g2-windowed-quota-v2-readonly',
            httpStatus:Number.isInteger(http)?http:null,parseValid:valid,
            narrowResponseShape,series:series.length,points,latestSample:latest,
            maximumObservedWindowGauge:sampledMax,
            scopeHttpStatus:Number.isInteger(scopeHttp)?scopeHttp:null,
            scopeShape,scopeSeries,scopeTargetSeries,scopeHasMore,
            guaranteedRemainingQuota:null,authorizedSearchCalls:0,
            youtubeApiCalls:0,gcsWrites:0,publicationPermitted:false}
          writeFileSync('artifacts/youtube-g2/pacific-search-preflight/windowed-v2.json',
            JSON.stringify(out)+'\n',{mode:0o600})
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\nWindowed quota-v2 HTTP '+out.httpStatus+
            '; parsed='+out.parseValid+'; series='+out.series+
            '; points='+out.points+'; latest='+String(out.latestSample)+
            '; narrow-shape='+out.narrowResponseShape+
            '; scope-HTTP='+out.scopeHttpStatus+
            '; scope-shape='+out.scopeShape+
            '; scope-series='+out.scopeSeries+
            '; target-series='+out.scopeTargetSeries+
            '; scope-has-more='+out.scopeHasMore+
            '; **never quota authorization**.\n')
          console.log(JSON.stringify(out))
          NODE
      - name: Query configured YouTube search quota via Service Usage (GET only; NO search)
        shell: bash
        run: |
          set -euo pipefail
          # Read-only v1beta1 API, same existing OIDC principal. Permission:
          # serviceusage.quotas.get. Never enable API, change quota or grant IAM.
          mkdir -p /tmp/moviehub-youtube-pt-budget-private
          token="$(gcloud auth print-access-token)"
          code="$(curl --silent --show-error --max-time 35 --retry 0 \
            --get --header "Authorization: Bearer $token" \
            --header 'Accept: application/json' \
            --data-urlencode 'view=FULL' \
            --data-urlencode 'pageSize=100' \
            --output '/tmp/moviehub-youtube-pt-budget-private/serviceusage.json' \
            --write-out '%{http_code}' \
            'https://serviceusage.googleapis.com/v1beta1/projects/612913221205/services/youtube.googleapis.com/consumerQuotaMetrics')"
          unset token
          [[ "$code" =~ ^[0-9]{3}$ ]] || {
            echo '::error::Invalid Service Usage HTTP response'
            exit 1
          }
          SERVICE_USAGE_HTTP="$code" node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs'
          const http=Number(process.env.SERVICE_USAGE_HTTP)
          let responseShape='http-not-200',parsed=false,metricCount=0
          let searchMetricCount=0,searchLimitCount=0,hasMorePages=false
          if(http===200){
            try{
              const doc=JSON.parse(readFileSync(
                '/tmp/moviehub-youtube-pt-budget-private/serviceusage.json','utf8'))
              if(!doc||typeof doc!=='object'||Array.isArray(doc))
                throw Error('invalid-object')
              if(doc.metrics===undefined){
                responseShape='metrics-omitted'
              }else{
                if(!Array.isArray(doc.metrics)||doc.metrics.length>100)
                  throw Error('invalid-metrics')
                responseShape=doc.metrics.length?'metrics-present':'metrics-empty'
                metricCount=doc.metrics.length
                for(const m of doc.metrics){
                  if(m?.metric!=='youtube.googleapis.com/search_list')continue
                  const limits=m.consumerQuotaLimits??[]
                  if(!Array.isArray(limits)||limits.length>100)
                    throw Error('invalid-limits')
                  searchMetricCount++
                  searchLimitCount+=limits.length
                }
                parsed=true
              }
              hasMorePages=typeof doc.nextPageToken==='string'
                &&doc.nextPageToken.length>0
            }catch{
              responseShape='invalid-json-or-shape';parsed=false
              metricCount=0;searchMetricCount=0;searchLimitCount=0
              hasMorePages=false
            }
          }
          // Service Usage reports a quota CONFIGURATION, never current usage,
          // remaining project quota, Google-wide serialization or permission
          // to perform search.list. This output cannot feed the search gate.
          const out={kind:'youtube-g2-serviceusage-configuration-readonly',
            httpStatus:Number.isInteger(http)?http:null,
            parsed,responseShape,metricCount,searchMetricCount,
            searchLimitCount,hasMorePages,observedQuotaUsage:null,
            guaranteedRemainingQuota:null,authorizedSearchCalls:0,
            youtubeApiCalls:0,gcsWrites:0,publicationPermitted:false}
          writeFileSync(
            'artifacts/youtube-g2/pacific-search-preflight/serviceusage.json',
            JSON.stringify(out)+'\n',{mode:0o600})
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\nConfigured YouTube search quota (Service Usage GET-only): HTTP '+
            out.httpStatus+'; shape='+out.responseShape+
            '; parsed='+out.parsed+'; metric-count='+out.metricCount+
            '; matching-search-metrics='+out.searchMetricCount+
            '; matching-limits='+out.searchLimitCount+
            '; pagination='+out.hasMorePages+
            '; **never a usage or search authorization**.\n')
          console.log(JSON.stringify(out))
          NODE
      - name: Interpret observed PT day quota defensively (NO lease)
        shell: bash
        env:
          NOW: ${{ steps.window.outputs.now }}
          RATE_HTTP: ${{ steps.monitoring.outputs.rate }}
          EXCEEDED_HTTP: ${{ steps.monitoring.outputs.exceeded }}
        run: |
          set -euo pipefail
          node scripts/youtube-g2-pacific-search-preflight.mjs \
            "$NOW" \
            "$RATE_HTTP" /tmp/moviehub-youtube-pt-budget-private/rate.json \
            "$EXCEEDED_HTTP" /tmp/moviehub-youtube-pt-budget-private/exceeded.json \
            artifacts/youtube-g2/pacific-search-preflight
          rm -rf /tmp/moviehub-youtube-pt-budget-private
      - name: Summarize only read-only metrics; do not publish an authorization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const p=JSON.parse(readFileSync(
            'artifacts/youtube-g2/pacific-search-preflight/summary.json','utf8'))
          if(p.kind!=='moviehub-youtube-g2-pacific-search-budget-preflight'
            ||p.measuredProjectDailyLimit!==100||p.researchBudgetProposed!==10
            ||p.acquiredSharedReservation!==false
            ||p.authorizedSearchCalls!==0||p.automaticSearchAllowed!==false
            ||p.currentQuotaRemaining!==null
            ||p.monitoringIsActualRemainingQuota!==false
            ||p.youtubeSearchCalls!==0||p.quotaWrites!==0
            ||p.firestoreWrites!==0||p.providerWrites!==0
            ||p.privateArtifact!==true||p.publicationPermitted!==false)
            throw Error('YOUTUBE_PACIFIC_BUDGET_WORKFLOW_UNSAFE')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '## YouTube search.list – aktueller Pacific-Tag (nur Beobachtung)',
            '',
            '- Pacific quota date: '+p.pacificDate,
            '- Reset UTC: '+p.nextResetUTC,
            '- Google quota limit: 100 search calls/PT day',
            '- Observed rate/net_usage: HTTP '+p.rate.http+
              ', '+p.rate.units+' sampled units, '+p.rate.points+' points',
            '- quota/exceeded: HTTP '+p.exceeded.http+
              ', '+p.exceeded.exceededTrue+' TRUE points',
            '- Potential 10-call plan advisory: '+p.smallBatchAdvisory,
            '- Blocks: '+(p.blocks.join(', ')||'none within observed read-only telemetry'),
            '- **NO guaranteed remaining quota, NO shared reservation, NO search authorization, NO YouTube calls and NO writes.**',
            '',
          ].join('\n')+'\n')
          NODE
      - name: Upload sanitized PT-day quota diagnostic privately (7 days)
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-pacific-search-preflight-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/pacific-search-preflight/summary.json
            artifacts/youtube-g2/pacific-search-preflight/windowed-v2.json
            artifacts/youtube-g2/pacific-search-preflight/serviceusage.json
            artifacts/youtube-g2/pacific-search-preflight/legacy-scope.json
          retention-days: 7
          if-no-files-found: error
