name: YouTube G2 – One-Time Live Production Sync Read-only QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-curated-sync-one-time-qa.yml

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  two-playlist-predeploy:
    if: contains(github.event.head_commit.message, '[youtube-curated-sync-qa-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate adapter and source publication gates
        run: |
          npm ci
          npx vitest run tests/youtube-g2-curated-source-sync.test.js tests/youtube-g2-curated-two-playlists.test.js tests/youtube-verified-route-precedence.test.js
      - name: Authenticate via current production GCP account
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: ACTUAL two playlist sync, no Firebase deploy or catalog mutations
        run: |
          node scripts/youtube-g2-curated-source-sync-live.mjs
          node scripts/generate-youtube-verified-route-index.mjs
      - name: Verify exact source and fallback invariants
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const p=JSON.parse(readFileSync('public/youtube-curated-source-status.json','utf8'))
          const a=JSON.parse(readFileSync('artifacts/youtube-g2/curated-production-sync/qa.json','utf8'))
          const i=JSON.parse(readFileSync('public/youtube-verified-title-routes.json','utf8'))
          if(p.sourcePlaylistCount!==2 || !p.fullyScanned || p.inventoryVideoIds<1
            ||a.audit.calls.search!==0||a.audit.calls.tmdb!==0
            ||i.kind!=='moviehub-youtube-verified-title-routes'
            ||a.catalogWrites!==0||a.firestoreWrites!==0||a.tmdbBadgeWrites!==0
            ||i.count!==p.approvedDEOfferRoutes) {
            throw new Error('CURATED_SYNC_LIVE_PREDEPLOY_QA_FAILED')
          }
          console.log(JSON.stringify({live:true,playlists:p.sourcePlaylistCount,
            uniqueVideoIds:p.inventoryVideoIds,details:p.videoDetailsResolved,
            conflict:p.playlistOverlapConflicts,confirmedDeRoutes:i.count,
            searchFallbackPreserved:true,productionWrites:0}))
          NODE
      - name: Private read-only QA artifact for seven days
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-production-sync-qa-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/curated-production-sync/qa.json
            public/youtube-curated-source-status.json
            public/youtube-verified-title-routes.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish aggregate QA status in existing issue 388
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync,writeFileSync} from 'node:fs'
          const p='public/youtube-curated-source-status.json'
          const lines=[
            '## G2 – echter produktionsgleicher Zwei-Playlist-Sync READ ONLY',
            '- Lauf: https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,
          ]
          if(existsSync(p)){
            const s=JSON.parse(readFileSync(p,'utf8'))
            lines.push(
              '- Quellen exakt: '+s.sourcePlaylistCount,
              '- API vollständig paginiert: '+s.fullyScanned,
              '- Live Video-IDs: '+s.inventoryVideoIds+'; mit Metadaten: '+s.videoDetailsResolved,
              '- Playlisten-Konflikte: '+s.playlistOverlapConflicts,
              '- Independently verified DE routes: '+s.approvedDEOfferRoutes,
              '- TMDB-Badges bleiben erhalten, original YouTube-Suchfallback vorhanden.',
              '- Produktionswrites/Firestore-Katalog-Importe: 0 (nur Read-only-QA).'
            )
          }else lines.push('- Noch kein erfolgreiches Live-QA-Artefakt – Laufprotokoll prüfen.')
          writeFileSync('/tmp/youtube-curated-prod-qa-comment.json',JSON.stringify({body:lines.join('\n')+'\n'}))
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/388/comments" --method POST --input /tmp/youtube-curated-prod-qa-comment.json
