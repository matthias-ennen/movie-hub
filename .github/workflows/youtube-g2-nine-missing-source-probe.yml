name: YouTube G2 – Nine missing FREE video IDs (read-only source probe)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-nine-missing-source-probe-readonly
  cancel-in-progress: false

jobs:
  nine-video-source-qa:
    name: Recheck only the nine previously unresolvable FREE video IDs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate read-only probe and negative safety tests
        run: |
          npm ci
          node --check scripts/youtube-g2-nine-missing-source-probe.mjs
          npx vitest run tests/youtube-g2-nine-missing-source-probe.test.js
      - name: Authenticate existing Google principal (no new permissions or keys)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Set up gcloud to read existing YouTube API secret
        uses: google-github-actions/setup-gcloud@v3
      - name: Read official API details of exactly nine known IDs
        run: node scripts/youtube-g2-nine-missing-source-probe.mjs
      - name: Preserve only sanitized local QA (7 days, never Hosting)
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-nine-missing-source-${{ github.run_id }}
          path: artifacts/youtube-g2/nine-missing-source-probe/qa.json
          if-no-files-found: error
          retention-days: 7
