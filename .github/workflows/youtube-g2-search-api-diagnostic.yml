name: YouTube G2 – four-hour isolated 429 API diagnosis (read only)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Diagnostic duration (60 or 240 minutes); no production writes"
        type: choice
        required: true
        default: '240'
        options:
          - '60'
          - '240'

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-api-diagnostic-readonly
  cancel-in-progress: false

jobs:
  api-diagnostic:
    name: Compare search.list with videos.list every 20 minutes
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      YT_DIAG_DURATION_MINUTES: ${{ inputs.duration_minutes }}
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate isolated read-only test logic before API calls
        run: |
          npm ci
          node --check scripts/youtube-g2-search-api-diagnostic.mjs
          npx vitest run tests/youtube-g2-search-api-diagnostic.test.js \
            tests/youtube-api-smoke.test.js
      - name: Authenticate restricted trusted GitHub identity (read-only diagnosis)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Probe same-key YouTube search and videos.list at 20-minute intervals
        run: node scripts/youtube-g2-search-api-diagnostic.mjs
      - name: Upload sanitized samples even if interrupted
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-search-api-diagnostic-${{ github.run_id }}
          path: artifacts/youtube-g2/search-api-diagnostic/
          if-no-files-found: warn
          retention-days: 14
