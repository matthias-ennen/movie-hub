name: YouTube G2 – TMDB-first YouTube Exact Link Pilot (Read-only)

on:
  workflow_dispatch:
  # One-time research run on an explicitly marked reviewed merge commit.
  # Future ordinary pushes NEVER run the research/API workflow.
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-tmdb-first-link-pilot.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-tmdb-first-link-research
  cancel-in-progress: false

jobs:
  tmdb-first-link-research:
    name: Existing MovieHub YouTube badges -> candidate video IDs (no imports)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[youtube-tmdb-first-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      # Only the explicitly labelled main-merge run uses the exact original
      # 25 Golden TMDB IDs. Manual research dispatch keeps legacy selection.
      YOUTUBE_G2_TMDB_FIRST_GOLDEN_REPLAY: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Research regression and budget gates BEFORE any API calls
        run: |
          npm ci
          node --check scripts/youtube-g2-tmdb-first-link-pilot.mjs
          node --check scripts/youtube-g2-tmdb-first-review-pack.mjs
          node --check scripts/youtube-g2-tmdb-first-prior-device-candidates.mjs
          npx vitest run tests/youtube-g2-tmdb-first-link-pilot.test.js tests/youtube-g2-tmdb-first-prior-device-candidates.test.js tests/youtube-g2-quality-golden.test.js tests/youtube-g2-tmdb-first-golden-rerun.test.js tests/youtube-g2-tmdb-first-historical-badge-drift.test.js tests/youtube-g2-tmdb-first-review-pack.test.js
      - name: Authenticate via existing Google OIDC (Secret Manager read only)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Set up gcloud to fetch existing YOUTUBE_API_KEY
        uses: google-github-actions/setup-gcloud@v3
      - name: Read published MovieHub titles and look up limited YouTube video IDs
        run: node scripts/youtube-g2-tmdb-first-link-pilot.mjs
      - name: Build private complete TMDB-first film/edition review queue (no API calls)
        run: node scripts/youtube-g2-tmdb-first-review-pack.mjs
      - name: Verify private research artifact consistency and deny automatic offers
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const base='artifacts/youtube-g2/tmdb-first-link-pilot/'
          const qa=JSON.parse(readFileSync(base+'qa.json','utf8'))
          const review=JSON.parse(readFileSync(base+'review-queue.json','utf8'))
          const rows=qa?.rows
          if(!Array.isArray(rows)||rows.length===0
            ||review?.kind!=='moviehub-youtube-g2-tmdb-first-manual-review-pack'
            ||review.privateArtifact!==true||review.publicationPermitted!==false
            ||review.approvedDirectLinks!==0||review.verifiedDEOffers!==0
            ||review.firestoreWrites!==0||review.catalogWrites!==0
            ||review.badgeWrites!==0
            ||review.items?.length!==rows.length
            ||review.sourceSelectedFilms!==rows.length
            ||rows.some(row=>row.publicationPermitted!==false
              ||row.directPlaybackRoute!==null||row.reviewedVideoId!==null)
            ||review.items.some(item=>{
              const original=rows.find(row=>row.tmdbId===item.tmdbId)
              return !original||item.publicationPermitted!==false
                ||item.playbackRoute!==null
                ||item.candidateVideos?.length!==original.videoCandidates?.length
            })
            ||(process.env.YOUTUBE_G2_TMDB_FIRST_GOLDEN_REPLAY==='1'
              && (rows.length!==25
                ||qa.summary?.historicalCohortMovies!==25))) {
            throw Error('PRIVATE_REVIEW_OUTPUT_INTEGRITY_GATE_FAILED')
          }
          console.log(JSON.stringify({
            privateReviewRows:rows.length,
            independentlyApprovedOffers:0,
            directRoutesPublished:0,
            noWrites:true,
          }))
          NODE
      - name: Upload internal QA only (7 days; no app/catalog deployment)
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-tmdb-first-links-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/tmdb-first-link-pilot/report.md
            artifacts/youtube-g2/tmdb-first-link-pilot/qa.json
            artifacts/youtube-g2/tmdb-first-link-pilot/golden-compare.json
            artifacts/youtube-g2/tmdb-first-link-pilot/golden-compare.md
            artifacts/youtube-g2/tmdb-first-link-pilot/review-queue.json
            artifacts/youtube-g2/tmdb-first-link-pilot/review-queue.md
          if-no-files-found: error
          retention-days: 7
