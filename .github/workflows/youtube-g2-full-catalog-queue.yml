name: YouTube G2 – Full Canonical Catalog / TMDB-first Batch (Read-only)

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Next cursor in exact public YouTube movie badge inventory'
        type: string
        required: true
        default: '0'
      batch_size:
        description: 'YouTube research works (max 25; two search requests each)'
        type: string
        required: true
        default: '10'
permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-g2-full-inventory-research-readonly
  cancel-in-progress: false

jobs:
  canonical-youtube-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      YOUTUBE_G2_RESEARCH_OFFSET: ${{ inputs.offset || '0' }}
      YOUTUBE_G2_RESEARCH_BATCH_SIZE: ${{ inputs.batch_size || '10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate complete inventory and bounded research WITHOUT API writes
        run: |
          npm ci
          node --check scripts/youtube-g2-full-catalog-queue.mjs
          node --check scripts/youtube-g2-full-catalog-queue-live.mjs
          node --check scripts/youtube-g2-tmdb-first-link-model.mjs
          node --check scripts/youtube-g2-tmdb-first-link-pilot.mjs
          npx vitest run tests/youtube-g2-full-catalog-queue.test.js tests/youtube-g2-tmdb-first-link-pilot.test.js tests/title-candidate-inventory.test.js
      - name: Authenticate existing MovieHub inventory reader (OIDC, no writes)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build canonical title inventory via existing #256 Firestore/browse/TV pathway
        run: npm run title:candidates:inventory
      - name: Select exact YouTube public badges from full inventory and research one capped batch
        run: node scripts/youtube-g2-full-catalog-queue-live.mjs
      - name: Save research QA for seven days – do not upload private Firestore inventory
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-full-catalog-research-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/full-catalog-queue/qa.json
            artifacts/youtube-g2/full-catalog-queue/report.md
          if-no-files-found: error
          retention-days: 7
