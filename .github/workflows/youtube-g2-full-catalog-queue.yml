name: YouTube G2 – Full Canonical Catalog / TMDB-first Batch (Read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-full-catalog-queue.yml
  workflow_dispatch:
    inputs:
      offset:
        description: 'Next cursor in exact public YouTube movie badge inventory'
        type: string
        required: true
      previous_run:
        description: 'Successful previous batch Actions run ID (REQUIRED if offset > 0)'
        type: string
        required: false
      batch_size:
        description: 'Films to research; uncached work permits exactly 1 reserved search per run'
        type: string
        required: true
        default: '1'
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: youtube-g2-private-candidate-checkpoint-mutations
  cancel-in-progress: false

jobs:
  canonical-youtube-research:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[youtube-one-guarded-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      DATA_CHECKPOINT_BUCKET: movie-hub-62459-nightly-checkpoints
      YOUTUBE_G2_RESEARCH_OFFSET: ${{ inputs.offset || '0' }}
      YOUTUBE_G2_RESEARCH_BATCH_SIZE: ${{ github.event_name == 'push' && '1' || inputs.batch_size || '1' }}
      YOUTUBE_G2_RESEARCH_PREVIOUS_RUN: ${{ inputs.previous_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate complete inventory and bounded research WITHOUT API writes
        run: |
          npm ci
          node --check scripts/youtube-g2-full-catalog-queue.mjs
          node --check scripts/youtube-g2-full-catalog-queue-live.mjs
          node --check scripts/youtube-g2-known-candidate-reuse.mjs
          node --check scripts/youtube-g2-durable-candidate-checkpoint.mjs
          node --check scripts/youtube-g2-tmdb-first-link-model.mjs
          node --check scripts/youtube-g2-tmdb-first-link-pilot.mjs
          npx vitest run tests/youtube-g2-full-catalog-queue.test.js tests/youtube-g2-tmdb-first-link-pilot.test.js tests/youtube-g2-known-candidate-reuse.test.js tests/youtube-g2-durable-candidate-checkpoint.test.js tests/title-candidate-inventory.test.js
      - name: Authenticate existing MovieHub inventory reader (OIDC, no writes)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build canonical title inventory via existing #256 Firestore/browse/TV pathway
        run: npm run title:candidates:inventory
      - name: Validate explicit research cursor and previous successful private batch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$YOUTUBE_G2_RESEARCH_OFFSET" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A manually chosen numeric cursor is required"
            exit 1
          fi
          if [[ "$YOUTUBE_G2_RESEARCH_OFFSET" == "0" ]]; then
            if [[ -n "$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN" ]]; then
              echo "::error::Offset zero must not carry an earlier research checkpoint"
              exit 1
            fi
            echo "Explicit initial batch at offset 0"
          else
            if [[ ! "$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Nonzero offset requires a prior successful main Actions run"
              exit 1
            fi
            source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN" --jq '[.conclusion,.status,.head_branch,.event,.path,.head_sha] | join("|")')"
            IFS='|' read -r conclusion state branch event workflow_path source_sha <<< "$source_run"
            if [[ "$conclusion" != "success" || "$state" != "completed"
              || "$branch" != "main"
              || "$workflow_path" != *".github/workflows/youtube-g2-full-catalog-queue.yml"*
              || ( "$event" != "workflow_dispatch" && "$event" != "push" ) ]]; then
              echo "::error::Research continuation source is not a completed trusted batch"
              exit 1
            fi
            if [[ "$event" == "push" ]]; then
              original_msg="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.commit.message')"
              if [[ "$original_msg" != *"[youtube-one-guarded-once]"* ]]; then
                echo "::error::Push research prior run was not the one authorized first-batch"
                exit 1
              fi
            fi
            artifact_name="youtube-g2-full-catalog-research-$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN"
            artifact_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("youtube-g2-full-catalog-research-")) | [.name,.expired] | join("|")')"
            if [[ "$artifact_state" != "$artifact_name|false" ]]; then
              echo "::error::Prior private research QA artifact is missing, expired or ambiguous"
              exit 1
            fi
            mkdir -p artifacts/youtube-g2/prior-full-catalog
            gh run download "$YOUTUBE_G2_RESEARCH_PREVIOUS_RUN" \
              --repo "$GITHUB_REPOSITORY" -n "$artifact_name" \
              -D artifacts/youtube-g2/prior-full-catalog
            test -s artifacts/youtube-g2/prior-full-catalog/qa.json
            echo "Trusted private research continuation downloaded"
          fi
      - name: Restore persistent private candidate checkpoint for existing film IDs
        run: node scripts/youtube-g2-durable-candidate-checkpoint.mjs read
      # Official YouTube API search.list is 1 CALL maximum (or 0 if all cached).
      # Quota monitoring alone is never sufficient: CAS and a hard 429 stop
      # are enforced in the live JS runner, before any search attempt.
      # This is deliberately read-only. Cloud Monitoring does not grant global
      # quota; the runner must still atomically reserve its ONE own search.
      # Missing, stale or untrusted samples fail closed before getSecret().
      - name: Collect current Pacific search telemetry (no YouTube calls)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moviehub-youtube-pt-search-private
          read -r checked_at day_start < <(node --input-type=module <<'NODE'
          import {pacificSearchDay} from './scripts/youtube-g2-pacific-search-preflight.mjs'
          const now=new Date().toISOString()
          console.log(now+' '+pacificSearchDay(now).start)
          NODE
          )
          token="$(gcloud auth print-access-token)"
          for type in rate exceeded; do
            if [[ "$type" == rate ]]; then metric='rate/net_usage'; else metric='exceeded'; fi
            filter="metric.type=\"serviceruntime.googleapis.com/quota/$metric\" AND resource.type=\"consumer_quota\" AND resource.label.service=\"youtube.googleapis.com\" AND metric.label.quota_metric=\"youtube.googleapis.com/search_list\""
            code="$(curl --silent --show-error --max-time 35 --retry 0 \
              --get --header "Authorization: Bearer $token" \
              --header 'Accept: application/json' \
              --data-urlencode "filter=$filter" \
              --data-urlencode "interval.startTime=$day_start" \
              --data-urlencode "interval.endTime=$checked_at" \
              --data-urlencode 'view=FULL' \
              --data-urlencode 'pageSize=5000' \
              --output "/tmp/moviehub-youtube-pt-search-private/$type.json" \
              --write-out '%{http_code}' \
              'https://monitoring.googleapis.com/v3/projects/movie-hub-62459/timeSeries')"
            [[ "$code" =~ ^[0-9]{3}$ ]] || exit 1
            printf '%s=%s\n' "$type" "$code" >> /tmp/moviehub-youtube-pt-search-private/status
          done
          unset token filter
          . /tmp/moviehub-youtube-pt-search-private/status
          node scripts/youtube-g2-pacific-search-preflight.mjs \
            "$checked_at" "$rate" /tmp/moviehub-youtube-pt-search-private/rate.json \
            "$exceeded" /tmp/moviehub-youtube-pt-search-private/exceeded.json \
            artifacts/youtube-g2/pacific-search-preflight
          rm -rf /tmp/moviehub-youtube-pt-search-private
      - name: Research at most one NEW movie with CAS quota reservation, no retry
        run: node scripts/youtube-g2-full-catalog-queue-live.mjs
      # The checkpoint contains film/video hypotheses ONLY. This never writes
      # Firestore, published badges, provider availability or playback routes.
      # Uploaded QA is validated against the exact selected film identities.
      - name: Merge completed read-only candidates into persistent private checkpoint
        run: node scripts/youtube-g2-durable-candidate-checkpoint.mjs merge
      - name: Summarize safe first batch without disclosing raw candidates
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs'
          const {plan,pilot}=JSON.parse(readFileSync('artifacts/youtube-g2/full-catalog-queue/qa.json','utf8'))
          const s=pilot.summary
          if(plan.batch.selectedCount>10||plan.batch.selectedCount<1
            ||s.processedMovies!==plan.batch.selectedCount
            ||s.calls.youtubeSearches>20||s.publicationPermitted!==false
            ||s.verifiedDirectLinks!==0||s.firestoreWrites!==0
            ||s.catalogWrites!==0||s.providerWrites!==0||s.badgeWrites!==0)
            throw Error('FIRST_TEN_GLOBAL_BATCH_EXCEEDED_BUDGET_OR_PUBLICATION_GATES')
          const summary=[
            '## MovieHub YouTube AP2 – new TMDB-badge first full-catalog batch',
            '',
            '- Films actually researched: '+s.processedMovies,
            '- New search.list requests used: '+s.calls.youtubeSearches,
            '- Minimum interval between sequential search.list calls: 20 seconds; automatic retries: 0',
            '- Reused global film candidates: '+(s.knownCandidateReuseMovies||0),
            '- Search requests avoided: '+(s.avoidedYoutubeSearchCalls||0),
            '- Current official videos.list batches: '+s.calls.youtubeVideoLookups,
            '- Single strong unapproved movie/video candidates: '+s.candidateLinksForReview,
            '- Status counts: '+JSON.stringify(s.statusCounts),
            '- Next cursor for authenticated continuation: '+plan.batch.nextOffset,
            '- Verified DE offers, player routes and published badges: 0',
            '',
          ]
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n')
          console.log(JSON.stringify({processed:s.processedMovies,
            searches:s.calls.youtubeSearches,avoided:s.avoidedYoutubeSearchCalls,
            candidates:s.candidateLinksForReview,nextOffset:plan.batch.nextOffset,
            verifiedDirectLinks:0,firestoreWrites:0}))
          NODE
      - name: Save research QA for seven days – do not upload private Firestore inventory
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-full-catalog-research-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/full-catalog-queue/qa.json
            artifacts/youtube-g2/full-catalog-queue/report.md
          if-no-files-found: error
          retention-days: 7
