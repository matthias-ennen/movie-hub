name: Shared EPG Identity G1d – isolated contract checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/sources/sharedEpgIdentityIndex.js
      - scripts/shared-epg-index-store.mjs
      - tests/shared-epg-identity-index.test.js
      - tests/shared-epg-index-store.test.js
      - .github/workflows/shared-epg-index-checks.yml

permissions:
  contents: read

jobs:
  checks:
    name: Verify independent fallback, slot conflicts and atomic cache snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Run focused shared index + existing airings regression tests
        run: npx vitest run tests/shared-epg-identity-index.test.js tests/shared-epg-index-store.test.js tests/merge-tv-airings.test.js
      - name: Syntax check shared optional index modules
        run: |
          node --check src/sources/sharedEpgIdentityIndex.js
          node --check scripts/shared-epg-index-store.mjs
