name: YouTube G2 – 125 New Videos / Configurable Channels / Full Adapter Read-only Audit

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: 'Quellen: alle registrierten Kanäle, einzelner Kanal oder eigene Kanal-IDs'
        type: choice
        options:
          - all
          - netzkino
          - cinenet
          - custom
        default: all
        required: true
      channel_ids:
        description: 'Nur bei custom: kommagetrennte YouTube UC-Kanal-IDs (max. 4)'
        type: string
        required: false
        default: ''
      replay_run_id:
        description: 'Gleiche 125 Video-IDs wie vorher: GitHub Actions Run-ID; leer = neue Uploads testen (bei Einzelkanal leeren)'
        type: string
        required: false
        default: '39754462653'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: youtube-g2-125-new-live-sources
  cancel-in-progress: false

jobs:
  large-125-preimport:
    name: 125 fresh videos / selected channels / matcher baseline v1 / zero writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      YOUTUBE_G2_SOURCE_MODE: ${{ inputs.source_mode }}
      YOUTUBE_G2_CHANNEL_IDS: ${{ inputs.channel_ids }}
      YOUTUBE_G2_REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
      YOUTUBE_G2_REPLAY_MANIFEST: artifacts/youtube-g2/replay-original/qa.json
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Authenticate via existing Google OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Set up gcloud access to read-only YouTube API key
        uses: google-github-actions/setup-gcloud@v3
      - name: Run mock 125-ID and contract safeguards BEFORE real API reads
        run: |
          npm ci
          node --check scripts/youtube-g2-large-live-audit.mjs
          node --check scripts/youtube-g2-prior-video-ids.mjs
          node --check scripts/youtube-g2-source-config.mjs
          npx vitest run tests/youtube-g2-source-config.test.js tests/youtube-g2-large-live-audit.test.js tests/youtube-source-adapter-preflight.test.js tests/youtube-g2-title-query-prep.test.js tests/youtube-g2-cinenet-title-query.test.js tests/youtube-g2-live-replay.test.js
      - name: Load original 125-ID internal QA artifact for exact replay when requested
        if: ${{ inputs.replay_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$YOUTUBE_G2_REPLAY_RUN_ID" in
            ''|*[!0-9]*) echo "Invalid replay run ID"; exit 1;;
          esac
          mkdir -p artifacts/youtube-g2/replay-original
          gh run download "$YOUTUBE_G2_REPLAY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "youtube-g2-125-new-preimport-$YOUTUBE_G2_REPLAY_RUN_ID" \
            --dir artifacts/youtube-g2/replay-original
          test -s "$YOUTUBE_G2_REPLAY_MANIFEST"
      - name: Read 125 original or new eligible YouTube videos and execute frozen matcher v1 against TMDB
        run: node scripts/youtube-g2-large-live-audit.mjs
      - name: Upload internal-only QA evidence, not a MovieHub catalog
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-125-new-preimport-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/large-125/report.md
            artifacts/youtube-g2/large-125/qa.json
          if-no-files-found: error
          retention-days: 7
