name: YouTube G2 – Missing Video Recovery + Existing Badge Bridge (Read-only)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Original fixed two-playlist QA run'
        required: true
        type: string
        default: '39816864480'
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: youtube-g2-recovery-badge-readonly
  cancel-in-progress: false

jobs:
  fixed-source-review:
    name: Retry missing fixed IDs and compare current exact YouTube badges, no deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Source QA, retry and canonical bridge safety tests
        run: |
          npm ci
          node --check scripts/youtube-g2-recovery-badge-bridge.mjs
          node --check scripts/youtube-g2-recovery-badge-bridge-live.mjs
          npx vitest run tests/youtube-g2-recovery-badge-bridge.test.js tests/youtube-g2-curated-tmdb-membership.test.js tests/youtube-g2-curated-two-playlists.test.js
      - name: Load original two-list QA with its exact video IDs
        uses: actions/download-artifact@v7
        with:
          name: youtube-g2-two-curated-playlists-${{ inputs.source_run_id || '39816864480' }}
          run-id: ${{ inputs.source_run_id || '39816864480' }}
          github-token: ${{ github.token }}
          path: artifacts/youtube-g2/curated-playlists
      - name: Authenticate for pre-existing YouTube API secret (read only)
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Recheck missing video IDs and match original 21 to existing MovieHub YouTube badges
        run: node scripts/youtube-g2-recovery-badge-bridge-live.mjs
      - name: Private internal QA for seven days, never publish film/link data
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-recovery-badge-bridge-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/recovery-badge-bridge/qa.json
            artifacts/youtube-g2/recovery-badge-bridge/report.md
          if-no-files-found: error
          retention-days: 7
