name: YouTube G2 – Curated Playlist TMDB Membership (Read-only)

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: 'Existing two-playlist QA run containing the exact previously observed video IDs'
        type: string
        required: true
        default: '39816864480'
  # One-time explicit read-only replay; ordinary pushes never run it.
  push:
    branches: [main]
    paths:
      - .github/workflows/youtube-g2-curated-tmdb-membership.yml

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: youtube-g2-curated-tmdb-read-only
  cancel-in-progress: false

jobs:
  curated-tmdb-research:
    name: Fixed playlist video IDs -> TMDB identity and public MovieHub index, no import
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[youtube-curated-query-once]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate strict read-only matching and source identity gates
        run: |
          npm ci
          node --check scripts/youtube-g2-curated-tmdb-membership.mjs
          node --check scripts/youtube-g2-curated-cast-evidence.mjs
          node --check scripts/youtube-g2-curated-title-query-plan.mjs
          node --check scripts/youtube-g2-curated-tmdb-membership-live.mjs
          npx vitest run tests/youtube-g2-curated-tmdb-membership.test.js tests/youtube-g2-curated-cast-evidence.test.js tests/youtube-g2-curated-title-query-plan.test.js
      - name: Download the exact 21-ID LIVE playlist QA, no new YouTube discovery
        uses: actions/download-artifact@v7
        with:
          name: youtube-g2-two-curated-playlists-${{ inputs.audit_run_id || '39816864480' }}
          run-id: ${{ inputs.audit_run_id || '39816864480' }}
          github-token: ${{ github.token }}
          path: artifacts/youtube-g2/curated-playlists
      - name: Live TMDB-only identity research and PUBLIC MovieHub membership
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: node scripts/youtube-g2-curated-tmdb-membership-live.mjs
      - name: Upload private 7-day QA with all 21 original video IDs (no provider writes)
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-curated-tmdb-membership-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/curated-tmdb-membership/qa.json
            artifacts/youtube-g2/curated-tmdb-membership/report.md
          if-no-files-found: error
          retention-days: 7
      - name: Summarize read-only query-repair QA in existing issue
        if: >-
          always() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[youtube-curated-query-once]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'
          const path='artifacts/youtube-g2/curated-tmdb-membership/qa.json'
          const lines=[
            '## YouTube G2 – gleiche 21 IDs, gezielte Title-Query-Korrektur, READ ONLY',
            '- Actions-Run: https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,
            '- Original-YouTube-Quellen-QA: 39816864480; keine neue YouTube-Suche.',
          ]
          if(existsSync(path)){
            const d=JSON.parse(readFileSync(path,'utf8')).summary
            lines.push(
              '- Quelle/Verarbeitung: '+d.sourceVideoIds+' / '+d.processedRows+' IDs',
              '- Matcher: '+d.matcherVersion,
              '- Gezielte Query-Korrekturen: '+d.curatedQueryCorrections,
              '- Review-Status: '+JSON.stringify(d.counts),
              '- Öffentlicher MovieHub-Index: '+JSON.stringify(d.publicIndexMembership),
              '- TMDB-GETs: '+d.tmdbCalls,
              '- Veröffentlichung: '+d.publicationPermitted+'; verifizierte Filme/DE-Angebote/Importe: 0/0/0.',
              '- Alle Produktionswrites: 0. Öffentlicher Index != gesamter Account-Katalog.'
            )
          } else {
            lines.push('- QA fehlgeschlagen/fehlend: keine Ergebnisbehauptung; Actions-Protokoll prüfen.')
          }
          writeFileSync('/tmp/youtube-query-qa.json',JSON.stringify({body:lines.join('\n')+'\n'}))
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/388/comments" --method POST --input /tmp/youtube-query-qa.json
