name: YouTube G2 – Curated Playlist TMDB Membership (Read-only)

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: 'Existing two-playlist QA run containing the exact previously observed video IDs'
        type: string
        required: true
        default: '39816864480'
permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-g2-curated-tmdb-read-only
  cancel-in-progress: false

jobs:
  curated-tmdb-research:
    name: Fixed playlist video IDs -> TMDB identity and public MovieHub index, no import
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate strict read-only matching and source identity gates
        run: |
          npm ci
          node --check scripts/youtube-g2-curated-tmdb-membership.mjs
          node --check scripts/youtube-g2-curated-cast-evidence.mjs
          node --check scripts/youtube-g2-curated-title-query-plan.mjs
          node --check scripts/youtube-g2-curated-tmdb-membership-live.mjs
          npx vitest run tests/youtube-g2-curated-tmdb-membership.test.js tests/youtube-g2-curated-cast-evidence.test.js tests/youtube-g2-curated-title-query-plan.test.js
      - name: Download the exact 21-ID LIVE playlist QA, no new YouTube discovery
        uses: actions/download-artifact@v7
        with:
          name: youtube-g2-two-curated-playlists-${{ inputs.audit_run_id || '39816864480' }}
          run-id: ${{ inputs.audit_run_id || '39816864480' }}
          github-token: ${{ github.token }}
          path: artifacts/youtube-g2/curated-playlists
      - name: Live TMDB-only identity research and PUBLIC MovieHub membership
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: node scripts/youtube-g2-curated-tmdb-membership-live.mjs
      - name: Upload private 7-day QA with all 21 original video IDs (no provider writes)
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-curated-tmdb-membership-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/curated-tmdb-membership/qa.json
            artifacts/youtube-g2/curated-tmdb-membership/report.md
          if-no-files-found: error
          retention-days: 7
