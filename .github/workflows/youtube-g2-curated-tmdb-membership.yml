name: YouTube G2 – Curated Playlist TMDB Membership (Read-only)

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: 'Successful Firebase Deploy run containing source-adapter-artifacts; blank = latest successful deploy'
        type: string
        required: false
  # Recheck only when this review workflow or its TMDB query/safety rules change.
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-g2-curated-tmdb-membership.yml'
      - 'scripts/youtube-g2-curated-title-query-plan.mjs'
      - 'scripts/youtube-g2-curated-tmdb-membership.mjs'
      - 'scripts/youtube-g2-first-offer-acceptance-pack.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-g2-curated-tmdb-read-only
  cancel-in-progress: false

jobs:
  curated-tmdb-research:
    name: Current production exact video IDs -> TMDB hypotheses (max 100; no writes)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate read-only matching, FREE precedence and identity-risk guards
        run: |
          npm ci
          node --check scripts/youtube-g2-curated-tmdb-membership.mjs
          node --check scripts/youtube-g2-curated-cast-evidence.mjs
          node --check scripts/youtube-g2-curated-title-query-plan.mjs
          node --check scripts/youtube-g2-curated-tmdb-membership-live.mjs
          node --check scripts/youtube-g2-first-offer-acceptance-pack.mjs
          npx vitest run tests/youtube-g2-curated-tmdb-membership.test.js tests/youtube-g2-curated-cast-evidence.test.js tests/youtube-g2-curated-title-query-plan.test.js tests/youtube-g2-first-offer-acceptance-pack.test.js
      - name: Select an existing successful Firebase source-QA generation
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_AUDIT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-firebase.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid or missing completed Firebase deploy run ID" >&2
            exit 1
          fi
          echo "Selected completed source generation from Firebase run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact current production source QA (no new YouTube discovery)
        uses: actions/download-artifact@v7
        with:
          name: source-adapter-artifacts-${{ steps.source.outputs.run_id }}-1
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/youtube-g2/production-download
      - name: Recover original read-only audit (exact IDs and provenance retained)
        run: |
          set -euo pipefail
          source_path="artifacts/youtube-g2/production-download/artifacts/youtube-g2/curated-production-sync/qa.json"
          test -s "$source_path"
          mkdir -p artifacts/youtube-g2/curated-playlists
          cp "$source_path" artifacts/youtube-g2/curated-playlists/qa.json
      - name: Live read-only TMDB research and PUBLIC MovieHub index membership
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: node scripts/youtube-g2-curated-tmdb-membership-live.mjs
      - name: Prepare three-case manual Android / Fire TV acceptance packet, no approvals
        run: node scripts/youtube-g2-first-offer-acceptance-pack.mjs
      - name: Upload private seven-day review QA and human-test checklist (no confirmed routes)
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-g2-curated-tmdb-membership-${{ github.run_id }}
          path: |
            artifacts/youtube-g2/curated-tmdb-membership/qa.json
            artifacts/youtube-g2/curated-tmdb-membership/report.md
            artifacts/youtube-g2/first-offer-manual-acceptance/qa.json
            artifacts/youtube-g2/first-offer-manual-acceptance/checklist.md
          if-no-files-found: error
          retention-days: 7
