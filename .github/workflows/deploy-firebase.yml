name: Deploy Firebase

on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC (04:17 CET / 05:17 CEST). TMDB and Waipu are refreshed
    # sequentially and published together; no second import job runs in parallel.
    - cron: '17 03 * * *'
  workflow_dispatch:
    inputs:
      data_mode:
        description: Datenaufbau pro Lauf
        required: true
        default: standard
        type: choice
        options:
          - standard
          - accelerated

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture last published data baseline
        id: workflow_baseline
        continue-on-error: true
        run: npm run workflow:baseline

      - name: Restore persistent TMDB change state
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        id: tmdb_change_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/tmdb-data
          key: tmdb-changes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tmdb-changes-v1-

      # A deliberately tagged main-branch commit provides an auditable emergency
      # refresh path when workflow_dispatch is unavailable. Ordinary code pushes
      # keep skipping the comparatively expensive live Waipu import.
      - name: Restore persistent Waipu import state
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        id: waipu_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
          key: waipu-fifty-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            waipu-fifty-v1-
            waipu-seven-v1-

      - name: Seed verified Waipu stability history
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        run: |
          mkdir -p artifacts/waipu-sync
          if [ ! -f artifacts/waipu-sync/checkpoint.json ]; then
            cp .github/waipu/checkpoint.seed.json artifacts/waipu-sync/checkpoint.json
          fi

      - name: Restore last deployed Waipu catalog
        run: npm run waipu:restore

      - name: Restore validated live TMDB data for code deploy
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') }}
        run: npm run tmdb:restore

      - name: Restore incremental search-detail metadata
        run: npm run search:details:restore

      - name: Restore incremental series-season metadata
        run: npm run series:details:restore

      - name: Collect TMDB movie and series changes
        id: tmdb_changes
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: npm run tmdb:changes

      - name: Generate TMDB catalog for strict refresh
        id: tmdb_catalog_strict
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_SEARCH_MOVIE_PAGES_PER_OFFER: 50
          TMDB_SEARCH_SERIES_PAGES_PER_OFFER: 50
          TMDB_SEARCH_DETAIL_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '800' }}
          TMDB_SEARCH_DETAIL_MAX_AGE_DAYS: 30
          TMDB_SERIES_SEASON_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '600' }}
        run: npm run tmdb:catalog

      - name: Acknowledge TMDB catalog change consumer
        if: ${{ steps.tmdb_catalog_strict.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- tmdb-catalog

      - name: Refresh 50-station Waipu grid
        id: waipu_sync
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          WAIPU_SYNC_LIVE: '1'
          WAIPU_SYNC_APPROVED_STAGE: '50'
          WAIPU_SYNC_REQUEST_BUDGET: '5000'
          WAIPU_SYNC_PACE_MS: '400'
          WAIPU_SYNC_JITTER_MS: '75'
        run: npm run waipu:sync -- --live --stage=50

      - name: Match and publish 50-station Waipu catalog
        id: waipu_catalog
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && steps.waipu_sync.outcome == 'success' }}
        continue-on-error: true
        env:
          WAIPU_CATALOG_LIVE: '1'
          WAIPU_LIVE_OUTPUT: public/waipu-live
          WAIPU_DETAIL_REQUEST_BUDGET: '10000'
          WAIPU_DETAIL_PACE_MS: '400'
          WAIPU_DETAIL_JITTER_MS: '75'
          WAIPU_TMDB_REQUEST_BUDGET: '4000'
          WAIPU_TMDB_PACE_MS: '250'
          WAIPU_TMDB_METADATA_REQUEST_BUDGET: '4000'
          WAIPU_TMDB_METADATA_CONCURRENCY: '3'
          WAIPU_TMDB_METADATA_MAX_AGE_DAYS: '30'
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
        run: npm run waipu:catalog -- --live

      - name: Acknowledge Waipu change consumer
        if: ${{ steps.waipu_catalog.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- waipu-catalog

      - name: Save persistent Waipu import state
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) }}
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
          key: waipu-fifty-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report data fill levels
        id: data_status
        env:
          DATA_STATUS_APPEND_SUMMARY: '0'
        run: npm run data:status

      - name: Build
        id: app_build
        run: npm run build

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com

      - name: Migrate legacy Movie-Hub presence parents
        id: presence_migration
        env:
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
        run: npm run moviehub:presence:migrate

      - name: Enrich personal Movie-Hub provider metadata
        id: shared_metadata
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
          MOVIE_HUB_METADATA_BACKFILL_LIMIT: 250
          MOVIE_HUB_METADATA_MAX_AGE_DAYS: 30
        run: npm run moviehub:metadata:backfill

      - name: Acknowledge Movie-Hub metadata change consumer
        if: ${{ steps.shared_metadata.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- moviehub-metadata

      - name: Enrich personal TMDB catalog metadata
        id: personal_tmdb_metadata
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
          PERSONAL_TMDB_METADATA_BACKFILL_LIMIT: 250
          PERSONAL_TMDB_METADATA_MAX_AGE_DAYS: 30
        run: npm run personal-tmdb:metadata:backfill

      - name: Acknowledge personal TMDB metadata change consumer
        if: ${{ steps.personal_tmdb_metadata.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- personal-tmdb-metadata

      - name: Validate TMDB change consumers before publication
        if: ${{ steps.tmdb_changes.outcome == 'success' }}
        run: npm run tmdb:changes:verify -- --exclude firebase-publication

      - name: Deploy Hosting and Firestore Rules
        id: firebase_deploy
        run: npx firebase-tools deploy --only hosting,firestore:rules --project movie-hub-62459 --non-interactive

      - name: Acknowledge published TMDB change generation
        if: ${{ steps.tmdb_changes.outcome == 'success' && steps.firebase_deploy.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- firebase-publication

      - name: Commit successful TMDB change checkpoint
        if: ${{ always() && steps.tmdb_changes.outcome == 'success' }}
        id: tmdb_change_commit
        run: npm run tmdb:changes:commit

      - name: Save persistent TMDB change state
        if: ${{ always() && steps.tmdb_changes.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: artifacts/tmdb-data
          key: tmdb-changes-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish compact data workflow report
        if: ${{ always() }}
        env:
          SUMMARY_DATA_MODE: ${{ inputs.data_mode || 'standard' }}
          SUMMARY_TMDB_CHANGES: ${{ steps.tmdb_changes.outcome }}
          SUMMARY_TMDB_CHECKPOINT: ${{ steps.tmdb_change_commit.outcome }}
          SUMMARY_TMDB_STRICT: ${{ steps.tmdb_catalog_strict.outcome }}
          SUMMARY_WAIPU_SYNC: ${{ steps.waipu_sync.outcome }}
          SUMMARY_WAIPU_CATALOG: ${{ steps.waipu_catalog.outcome }}
          SUMMARY_PRESENCE: ${{ steps.presence_migration.outcome }}
          SUMMARY_METADATA: ${{ steps.shared_metadata.outcome }}
          SUMMARY_PERSONAL_TMDB: ${{ steps.personal_tmdb_metadata.outcome }}
          SUMMARY_BUILD: ${{ steps.app_build.outcome }}
          SUMMARY_AUTH: ${{ steps.gcp_auth.outcome }}
          SUMMARY_DEPLOY: ${{ steps.firebase_deploy.outcome }}
        run: npm run workflow:summary

      - name: Upload search-index diagnostics
        if: ${{ always() && steps.tmdb_catalog_strict.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: search-index-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/search-index-run-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Report failed scheduled Waipu refresh
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && (steps.waipu_sync.outcome != 'success' || steps.waipu_catalog.outcome != 'success') }}
        run: |
          echo "::error::Waipu refresh failed; the last validated catalog remained in public/waipu-live."
          exit 1
