name: Deploy Firebase

on:
  push:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC (04:17 CET / 05:17 CEST). TMDB and Waipu are refreshed
    # sequentially and published together; no second import job runs in parallel.
    - cron: '17 03 * * *'
  workflow_dispatch:
    inputs:
      data_mode:
        description: Datenaufbau pro Lauf
        required: true
        default: standard
        type: choice
        options:
          - standard
          - accelerated

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # A deliberately tagged main-branch commit provides an auditable emergency
      # refresh path when workflow_dispatch is unavailable. Ordinary code pushes
      # keep skipping the comparatively expensive live Waipu import.
      - name: Restore persistent Waipu import state
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        id: waipu_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
          key: waipu-seven-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            waipu-seven-v1-

      - name: Seed verified Waipu stability history
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        run: |
          mkdir -p artifacts/waipu-sync
          if [ ! -f artifacts/waipu-sync/checkpoint.json ]; then
            cp .github/waipu/checkpoint.seed.json artifacts/waipu-sync/checkpoint.json
          fi

      - name: Restore last deployed Waipu catalog
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        run: npm run waipu:restore

      - name: Restore incremental search-detail metadata
        continue-on-error: true
        run: npm run search:details:restore

      - name: Restore incremental series-season metadata
        continue-on-error: true
        run: npm run series:details:restore

      - name: Generate TMDB catalog for strict refresh
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_SEARCH_MOVIE_PAGES_PER_OFFER: 50
          TMDB_SEARCH_SERIES_PAGES_PER_OFFER: 50
          TMDB_SEARCH_DETAIL_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '800' }}
          TMDB_SEARCH_DETAIL_MAX_AGE_DAYS: 30
          TMDB_SERIES_SEASON_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '600' }}
        run: npm run tmdb:catalog

      - name: Generate fresh TMDB catalog for code deploy
        id: push_catalog
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_SEARCH_MOVIE_PAGES_PER_OFFER: 50
          TMDB_SEARCH_SERIES_PAGES_PER_OFFER: 50
          TMDB_SEARCH_DETAIL_ENRICH_LIMIT: ${{ contains(github.event.head_commit.message, '[data-bootstrap]') && '2000' || '800' }}
          TMDB_SEARCH_DETAIL_MAX_AGE_DAYS: 30
          TMDB_SERIES_SEASON_ENRICH_LIMIT: ${{ contains(github.event.head_commit.message, '[data-bootstrap]') && '2000' || '600' }}
        run: npm run tmdb:catalog

      - name: Reuse last deployed catalog after transient refresh failure
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') && steps.push_catalog.outcome == 'failure' }}
        run: |
          echo "Fresh TMDB catalog did not pass its quality gate; reusing the last deployed catalog."
          curl --fail --silent --show-error --location \
            https://movie-hub-62459.web.app/catalog.json \
            --output public/catalog.json
          node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('public/catalog.json','utf8')); if(c?.source!=='tmdb'||!Array.isArray(c?.titles)||c.titles.length===0||!Array.isArray(c?.rowDefinitions)||c.rowDefinitions.length===0) throw new Error('Last deployed catalog is not a valid non-empty TMDB catalog.'); console.log('Reusing live TMDB catalog with '+c.titles.length+' titles from '+(c.generatedAt||'unknown time')+'.');"

          if curl --fail --silent --show-error --location \
            https://movie-hub-62459.web.app/search-index.json \
            --output public/search-index.json \
            && node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync('public/search-index.json','utf8')); if(s?.kind!=='search-index'||!Array.isArray(s?.entries)||s.entries.length===0) process.exit(1); console.log('Reusing live search index with '+s.entries.length+' entries from '+(s.generatedAt||'unknown time')+'.');"; then
            echo "Live search index validated."
          else
            echo "No reusable live search index found; deriving one from the restored catalog."
            rm -f public/search-index.json
            npm run search:index
          fi

          if npm run search:details:restore; then
            echo "Live lazy search details validated."
          else
            echo "No reusable live detail shards found; deriving fallback details from the restored catalog."
            npm run search:details
          fi

      - name: Refresh seven-station Waipu grid
        id: waipu_sync
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          WAIPU_SYNC_LIVE: '1'
          WAIPU_SYNC_REQUEST_BUDGET: '700'
        run: npm run waipu:sync -- --live --stage=7

      - name: Match and publish seven-station Waipu test catalog
        id: waipu_catalog
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && steps.waipu_sync.outcome == 'success' }}
        continue-on-error: true
        env:
          WAIPU_CATALOG_LIVE: '1'
          WAIPU_TEST_MODE: '1'
          WAIPU_LIVE_OUTPUT: public/waipu-live
          WAIPU_DETAIL_REQUEST_BUDGET: '1600'
          WAIPU_DETAIL_PACE_MS: '400'
          WAIPU_DETAIL_JITTER_MS: '100'
          WAIPU_TMDB_REQUEST_BUDGET: '400'
          WAIPU_TMDB_PACE_MS: '250'
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
        run: npm run waipu:catalog -- --live

      - name: Save persistent Waipu import state
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) }}
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
          key: waipu-seven-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report data fill levels
        run: npm run data:status

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com

      - name: Migrate legacy Movie-Hub presence parents
        env:
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
        run: npm run moviehub:presence:migrate

      - name: Enrich personal Movie-Hub provider metadata
        continue-on-error: true
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
          MOVIE_HUB_METADATA_BACKFILL_LIMIT: 250
          MOVIE_HUB_METADATA_MAX_AGE_DAYS: 30
        run: npm run moviehub:metadata:backfill

      - name: Deploy Hosting and Firestore Rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project movie-hub-62459 --non-interactive

      - name: Report failed scheduled Waipu refresh
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && (steps.waipu_sync.outcome != 'success' || steps.waipu_catalog.outcome != 'success') }}
        run: |
          echo "::error::Waipu refresh failed; the last validated catalog remained in public/waipu-live."
          exit 1
