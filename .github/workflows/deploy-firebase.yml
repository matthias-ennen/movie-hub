name: Deploy Firebase

on:
  push:
    branches: [main]
  schedule:
    # GitHub evaluates cron in UTC. These summer/winter triggers bracket 03:17
    # Europe/Berlin; the gate below starts at most one full data run per local day.
    - cron: '17 01 * * *'
    - cron: '17 02 * * *'
  workflow_dispatch:
    inputs:
      data_mode:
        description: Datenaufbau pro Lauf
        required: true
        default: standard
        type: choice
        options:
          - standard
          - accelerated

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select the daily 03:17 Europe/Berlin run
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_WORKFLOW_TIMEZONE: Europe/Berlin
          DATA_WORKFLOW_HOUR: '3'
          DATA_WORKFLOW_MINUTE: '17'
          DATA_WORKFLOW_NAME: Deploy Firebase
        run: node scripts/check-data-workflow-schedule.mjs --gate

  deploy:
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    env:
      DATA_CHECKPOINT_BUCKET: ${{ vars.MOVIE_HUB_CHECKPOINT_BUCKET }}
      DATA_CHECKPOINT_ENABLED: ${{ vars.MOVIE_HUB_DURABLE_CHECKPOINT_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Capture scheduled start timing
        env:
          DATA_WORKFLOW_TIMEZONE: Europe/Berlin
          DATA_WORKFLOW_HOUR: '3'
          DATA_WORKFLOW_MINUTE: '17'
          DATA_WORKFLOW_MAX_DELAY_MINUTES: '60'
        run: node scripts/check-data-workflow-schedule.mjs --capture

      - name: Install dependencies
        run: npm ci

      - name: Capture last published data baseline
        id: workflow_baseline
        continue-on-error: true
        run: npm run workflow:baseline

      - name: Restore title-candidate baseline
        id: title_candidate_state_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: artifacts/title-candidate-state.json
          key: title-candidate-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: title-candidate-state-v1-

      - name: Restore persistent TMDB change state
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        id: tmdb_change_cache
        uses: actions/cache/restore@v6
        with:
          path: artifacts/tmdb-data
          key: tmdb-changes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tmdb-changes-v1-

      # A deliberately tagged main-branch commit provides an auditable emergency
      # refresh path when workflow_dispatch is unavailable. Ordinary code pushes
      # keep skipping the comparatively expensive live Waipu import.
      - name: Restore persistent Waipu import state
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        id: waipu_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
            artifacts/waipu-live/unresolved.json
          key: waipu-curated-228-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            waipu-curated-228-v1-
            waipu-hundred-v1-
            waipu-fifty-v1-
            waipu-seven-v1-

      - name: Authenticate for private checkpoint restore
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && env.DATA_CHECKPOINT_ENABLED == 'true' && env.DATA_CHECKPOINT_BUCKET != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com

      - name: Restore verified private TMDB checkpoint
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && env.DATA_CHECKPOINT_ENABLED == 'true' && env.DATA_CHECKPOINT_BUCKET != '' }}
        run: node scripts/durable-data-checkpoint.mjs restore tmdb

      - name: Restore verified private Waipu checkpoint and cache
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && env.DATA_CHECKPOINT_ENABLED == 'true' && env.DATA_CHECKPOINT_BUCKET != '' }}
        run: node scripts/durable-data-checkpoint.mjs restore waipu

      - name: Seed verified Waipu stability history
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        run: |
          mkdir -p artifacts/waipu-sync
          if [ ! -f artifacts/waipu-sync/checkpoint.json ]; then
            cp .github/waipu/checkpoint.seed.json artifacts/waipu-sync/checkpoint.json
          fi

      - name: Restore last deployed Waipu catalog
        run: npm run waipu:restore

      - name: Restore validated live TMDB data for code deploy
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') }}
        run: npm run tmdb:restore

      - name: Restore incremental search-detail metadata
        run: npm run search:details:restore

      - name: Restore incremental series-season metadata
        run: npm run series:details:restore

      - name: Collect TMDB movie and series changes
        id: tmdb_changes
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: npm run tmdb:changes

      - name: Generate TMDB catalog for strict refresh
        id: tmdb_catalog_strict
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_SEARCH_MOVIE_PAGES_PER_OFFER: 50
          TMDB_SEARCH_SERIES_PAGES_PER_OFFER: 50
          TMDB_SEARCH_DETAIL_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '800' }}
          TMDB_SEARCH_DETAIL_MAX_AGE_DAYS: 30
          TMDB_SERIES_SEASON_ENRICH_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '600' }}
        run: npm run tmdb:catalog

      - name: Acknowledge TMDB catalog change consumer
        if: ${{ steps.tmdb_catalog_strict.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- tmdb-catalog

      - name: Refresh curated 228-station Waipu grid
        id: waipu_sync
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        continue-on-error: true
        env:
          WAIPU_SYNC_LIVE: '1'
          WAIPU_SYNC_APPROVED_STAGE: '228'
          WAIPU_SYNC_REQUEST_BUDGET: '5000'
          WAIPU_SYNC_PACE_MS: '400'
          WAIPU_SYNC_JITTER_MS: '75'
        run: npm run waipu:sync -- --live --stage=228

      - name: Match and publish curated 228-station Waipu catalog
        id: waipu_catalog
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && steps.waipu_sync.outcome == 'success' }}
        continue-on-error: true
        env:
          WAIPU_CATALOG_LIVE: '1'
          WAIPU_LIVE_OUTPUT: public/waipu-live
          WAIPU_DETAIL_REQUEST_BUDGET: '10000'
          WAIPU_DETAIL_PACE_MS: '400'
          WAIPU_DETAIL_JITTER_MS: '75'
          WAIPU_TMDB_REQUEST_BUDGET: '4000'
          WAIPU_TMDB_PACE_MS: '250'
          WAIPU_TMDB_METADATA_REQUEST_BUDGET: '4000'
          WAIPU_TMDB_METADATA_CONCURRENCY: '3'
          WAIPU_TMDB_METADATA_MAX_AGE_DAYS: '30'
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
        run: npm run waipu:catalog -- --live

      - name: Acknowledge Waipu change consumer
        if: ${{ steps.waipu_catalog.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- waipu-catalog

      - name: Save persistent Waipu import state
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) }}
        uses: actions/cache/save@v6
        with:
          path: |
            artifacts/waipu-sync
            artifacts/waipu-live/match-decisions.json
            artifacts/waipu-live/detail-status.json
            artifacts/waipu-live/unresolved.json
          key: waipu-curated-228-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified private Waipu checkpoint and cache
        id: waipu_checkpoint_upload
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && env.DATA_CHECKPOINT_ENABLED == 'true' && env.DATA_CHECKPOINT_BUCKET != '' && steps.waipu_sync.outcome != 'skipped' }}
        run: node scripts/durable-data-checkpoint.mjs upload waipu

      - name: Probe uploaded private Waipu checkpoint and cache
        if: ${{ always() && steps.waipu_checkpoint_upload.outcome == 'success' }}
        run: node scripts/durable-data-checkpoint.mjs probe waipu

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com

      - name: Migrate legacy Movie-Hub presence parents
        id: presence_migration
        env:
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
        run: npm run moviehub:presence:migrate

      # #256 consolidates every catalog-relevant source before one canonical
      # executor resolves and fans out the selected identities.
      - name: Inventory canonical title candidates
        id: candidate_inventory
        continue-on-error: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
        run: npm run title:candidates:inventory

      - name: Preview canonical title priority queue
        id: priority_preview
        continue-on-error: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TITLE_PRIORITY_PREVIEW_LIMIT: ${{ (inputs.data_mode == 'accelerated' || contains(github.event.head_commit.message, '[data-bootstrap]')) && '2000' || '800' }}
        run: npm run title:priority:preview

      - name: Execute canonical title priority queue
        id: canonical_executor
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]') }}
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
          TITLE_CANONICAL_TMDB_REQUEST_BUDGET: 5000
          TITLE_CANONICAL_CONCURRENCY: 3
          TITLE_CANONICAL_MAX_AGE_DAYS: 30
        run: npm run title:priority:execute

      - name: Acknowledge Movie-Hub metadata change consumer
        if: ${{ steps.canonical_executor.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- moviehub-metadata

      - name: Acknowledge personal TMDB metadata change consumer
        if: ${{ steps.canonical_executor.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- personal-tmdb-metadata

      - name: Report data fill levels
        id: data_status
        env:
          DATA_STATUS_APPEND_SUMMARY: '0'
        run: npm run data:status

      - name: Build
        id: app_build
        run: npm run build

      - name: Validate TMDB change consumers before publication
        if: ${{ steps.tmdb_changes.outcome == 'success' }}
        run: npm run tmdb:changes:verify -- --exclude firebase-publication

      - name: Deploy Hosting and Firestore Rules
        id: firebase_deploy
        run: npx firebase-tools deploy --only hosting,firestore:rules --project movie-hub-62459 --non-interactive

      - name: Check observed titles for personal in-app notifications
        id: title_alerts
        if: ${{ github.event_name != 'push' && steps.firebase_deploy.outcome == 'success' }}
        env:
          GOOGLE_CLOUD_PROJECT: movie-hub-62459
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
        run: npm run alerts:check

      - name: Acknowledge published TMDB change generation
        if: ${{ steps.tmdb_changes.outcome == 'success' && steps.firebase_deploy.outcome == 'success' }}
        run: npm run tmdb:changes:ack -- firebase-publication

      - name: Save published title-candidate baseline
        if: ${{ steps.priority_preview.outcome == 'success' && steps.firebase_deploy.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: artifacts/title-candidate-state.json
          key: title-candidate-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit successful TMDB change checkpoint
        if: ${{ always() && steps.tmdb_changes.outcome == 'success' }}
        id: tmdb_change_commit
        run: npm run tmdb:changes:commit

      - name: Save persistent TMDB change state
        if: ${{ always() && steps.tmdb_changes.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: artifacts/tmdb-data
          key: tmdb-changes-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save verified private TMDB checkpoint
        id: tmdb_checkpoint_upload
        if: ${{ always() && steps.tmdb_change_commit.outcome == 'success' && env.DATA_CHECKPOINT_ENABLED == 'true' && env.DATA_CHECKPOINT_BUCKET != '' }}
        run: node scripts/durable-data-checkpoint.mjs upload tmdb

      - name: Probe uploaded private TMDB checkpoint
        if: ${{ always() && steps.tmdb_checkpoint_upload.outcome == 'success' }}
        run: node scripts/durable-data-checkpoint.mjs probe tmdb

      - name: Publish compact data workflow report
        if: ${{ always() }}
        env:
          SUMMARY_DATA_MODE: ${{ inputs.data_mode || 'standard' }}
          SUMMARY_TMDB_CHANGES: ${{ steps.tmdb_changes.outcome }}
          SUMMARY_TMDB_CHECKPOINT: ${{ steps.tmdb_change_commit.outcome }}
          SUMMARY_TMDB_STRICT: ${{ steps.tmdb_catalog_strict.outcome }}
          SUMMARY_WAIPU_SYNC: ${{ steps.waipu_sync.outcome }}
          SUMMARY_WAIPU_CATALOG: ${{ steps.waipu_catalog.outcome }}
          SUMMARY_PRESENCE: ${{ steps.presence_migration.outcome }}
          SUMMARY_CANONICAL_EXECUTOR: ${{ steps.canonical_executor.outcome }}
          SUMMARY_CANDIDATE_INVENTORY: ${{ steps.candidate_inventory.outcome }}
          SUMMARY_PRIORITY_PREVIEW: ${{ steps.priority_preview.outcome }}
          SUMMARY_BUILD: ${{ steps.app_build.outcome }}
          SUMMARY_AUTH: ${{ steps.gcp_auth.outcome }}
          SUMMARY_DEPLOY: ${{ steps.firebase_deploy.outcome }}
        run: npm run workflow:summary

      - name: Upload search-index diagnostics
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) }}
        uses: actions/upload-artifact@v7
        with:
          name: search-index-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/search-index-run-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload title-candidate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: title-candidate-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/title-candidate-inventory-summary.json
            artifacts/title-priority-preview-summary.json
            artifacts/title-canonical-executor-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report failed scheduled Waipu refresh
        if: ${{ always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[waipu-refresh]')) && (steps.waipu_sync.outcome != 'success' || steps.waipu_catalog.outcome != 'success') }}
        run: |
          echo "::error::Waipu refresh failed; the last validated catalog remained in public/waipu-live."
          exit 1
