name: Shared EPG G1e – isolated private Joyn original matcher capture

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/epg-g1e-isolated-pilot-core.mjs
      - scripts/epg-g1e-private-original-source-pilot.mjs
      - tests/epg-g1e-isolated-pilot-core.test.js
      - .github/workflows/shared-epg-g1e-private-joyn-capture.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/shared-epg-g1e-private-joyn-capture.yml
      - scripts/epg-g1e-private-original-source-pilot.mjs
      - scripts/epg-g1e-isolated-pilot-core.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: 'Privater Modus: capture ist OHNE zusaetzlichen Waipu-A/B-TMDB-Test'
        type: choice
        required: true
        default: capture
        options:
          - capture
          - ab
      confirmation:
        description: 'Exakt PRIVATE_G1E_CAPTURE_ONLY bzw PRIVATE_G1E_AB_MAX_4_PER_ARM'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: g1e-private-original-matcher-pilot
  cancel-in-progress: false

jobs:
  synthetic-tests:
    name: Confirm source isolation, fail-closed gates and no PR secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Synthetic private pilot and original matcher controller tests ONLY
        run: >-
          npx vitest run
          tests/epg-g1e-isolated-pilot-core.test.js
          tests/epg-g1e-waipu-replay-input-selection.test.js
          tests/epg-g1e-waipu-bounded-ab-controller.test.js
          tests/epg-g1e-private-waipu-ab-preflight.test.js

  isolated-private-capture:
    name: Explicit one-shot PRIVATE original Joyn/Waipu capture (no publication)
    needs: synthetic-tests
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' &&
            ((inputs.mode == 'capture' &&
              inputs.confirmation == 'PRIVATE_G1E_CAPTURE_ONLY') ||
             (inputs.mode == 'ab' &&
              inputs.confirmation == 'PRIVATE_G1E_AB_MAX_4_PER_ARM'))) ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.message,
              '[g1e-joyn-capture-once]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      DATA_CHECKPOINT_ENABLED: ${{ vars.MOVIE_HUB_DURABLE_CHECKPOINT_ENABLED }}
      DATA_CHECKPOINT_BUCKET: ${{ vars.MOVIE_HUB_CHECKPOINT_BUCKET }}
      GOOGLE_CLOUD_PROJECT: movie-hub-62459
      G1E_PRIVATE_PILOT_ISOLATED: '1'
      G1E_PRIVATE_PILOT_CONFIRM: ${{ github.event_name == 'push' && 'PRIVATE_G1E_CAPTURE_ONLY' || inputs.confirmation }}
      G1E_PRIVATE_MODE: ${{ github.event_name == 'push' && 'capture' || inputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Fail closed unless existing isolated PRIVATE checkpoints and an exact mode are requested
        run: |
          test "$DATA_CHECKPOINT_ENABLED" = "true"
          test "$DATA_CHECKPOINT_BUCKET" = "movie-hub-62459-nightly-checkpoints"
          test "${{ github.ref }}" = "refs/heads/main"
          if [ "$G1E_PRIVATE_MODE" = "capture" ]; then
            test "$G1E_PRIVATE_PILOT_CONFIRM" = "PRIVATE_G1E_CAPTURE_ONLY"
          elif [ "$G1E_PRIVATE_MODE" = "ab" ]; then
            test "$G1E_PRIVATE_PILOT_CONFIRM" = "PRIVATE_G1E_AB_MAX_4_PER_ARM"
            test "${{ github.event_name }}" = "workflow_dispatch"
          else
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Authenticate only to existing private checkpoint storage
        uses: google-github-actions/auth@v3
        with:
          project_id: movie-hub-62459
          workload_identity_provider: projects/612913221205/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-movie-hub-deploy@movie-hub-62459.iam.gserviceaccount.com
      - name: Restore original PRIVATE Waipu checkpoint into ephemeral runner
        run: node scripts/durable-data-checkpoint.mjs restore waipu
      - name: Restore original PRIVATE Joyn checkpoint into ephemeral runner
        run: node scripts/durable-data-checkpoint.mjs restore joyn
      - name: Restore existing validated TMDB catalog (not source matching)
        run: npm run tmdb:restore
      - name: Require original Waipu cache and healthy synced source states BEFORE any source call
        run: |
          node scripts/epg-g1e-private-waipu-ab-preflight.mjs \
            --root . \
            --output artifacts/g1e-private-pilot/preflight.json
      - name: Isolated real Joyn ORIGINAL generation + no-publish Waipu overlap
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          TMDB_LANGUAGE: de-DE
          TMDB_COUNTRY: DE
          JOYN_EPG_REQUEST_BUDGET: '250'
          JOYN_TMDB_REQUEST_BUDGET: '30'
          JOYN_TMDB_DETAIL_REQUEST_BUDGET: '10'
          JOYN_TMDB_METADATA_REQUEST_BUDGET: '30'
          JOYN_TMDB_METADATA_CONCURRENCY: '2'
          JOYN_ALGOLIA_REQUEST_BUDGET: '90'
          JOYN_SERIES_DETAIL_REQUEST_BUDGET: '20'
          JOYN_EPISODE_REQUEST_BUDGET: '30'
          JOYN_TMDB_PACE_MS: '250'
        run: |
          node --max-old-space-size=4096 scripts/epg-g1e-private-original-source-pilot.mjs \
            --mode "$G1E_PRIVATE_MODE"
      - name: Verify only fixed-schema anonymous pilot report is eligible for upload
        if: ${{ always() }}
        run: |
          if [ -s artifacts/g1e-private-pilot/aggregate.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const x = JSON.parse(readFileSync("artifacts/g1e-private-pilot/aggregate.json", "utf8"));
              if (x.kind !== "g1e-isolated-private-original-source-capture") process.exit(1);
              if (!["failed-closed", undefined].includes(x.status)) process.exit(1);
              const raw = JSON.stringify(x);
              if (raw.length > 12000 || raw.includes("approvedEvidence") ||
                  raw.includes("matcherInput") || raw.includes("sourceRefs") ||
                  raw.includes("Bearer ") || raw.includes("joynProgramId")) process.exit(1);
              if (x.joynEpg !== undefined) {
                const e = x.joynEpg;
                const required = [
                  "baseWindows", "processedWindows", "cacheHits",
                  "subdividedWindows", "startedEpgRequests", "retryAttempts",
                  "configuredEpgBudget", "completedFullHorizon",
                ];
                if (x.status !== "failed-closed" ||
                    x.phase !== "joyn-original-generation" ||
                    x.failureClass !== "JOYN_EPG_REQUEST_BUDGET" ||
                    Object.keys(e).some(key => !required.includes(key)) ||
                    required.some(key => !(key in e)) ||
                    e.baseWindows !== 56 || e.configuredEpgBudget !== 250 ||
                    e.startedEpgRequests !== 250 ||
                    e.completedFullHorizon !== false ||
                    [e.processedWindows, e.cacheHits, e.subdividedWindows, e.retryAttempts]
                      .some(n => !Number.isSafeInteger(n) || n < 0 || n > 250) ||
                    e.processedWindows > 56 ||
                    e.cacheHits > e.processedWindows) process.exit(1);
              }
            '
          fi
      - name: Upload ONLY anonymized small aggregate QA reports (no raw source or cache files)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: g1e-private-original-capture-aggregates-${{ github.run_id }}
          path: |
            artifacts/g1e-private-pilot/preflight.json
            artifacts/g1e-private-pilot/aggregate.json
          if-no-files-found: warn
          retention-days: 7
