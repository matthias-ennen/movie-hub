name: Phase 9 lockfile refresh

on:
  push:
    branches: [issue-346-phase9-firebase-tools]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-346-phase9-firebase-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Report audit delta
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || true
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "#346 Phase 9A: firebase-tools lockfile aktualisieren"
          git push origin HEAD:issue-346-phase9-firebase-tools
